name: initializer

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: initializer
      POSTGRES_USER: initializer
      POSTGRES_PASSWORD: ${INITIALIZER_PG_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:10132:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U initializer -d initializer"]
      interval: 5s
      timeout: 3s
      retries: 10
  # initializer:module identity|multi
  # One-shot, idempotent: creates or updates the role and database of every backend and of every Kratos on the shared server (L11).
  postgres-init:
    image: postgres:18
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - bash
      - -ec
      - |
        for variable in $$(compgen -e | grep '^PG_ROLE_' | sort); do
          role="$${variable#PG_ROLE_}"
          value="$${!variable}"
          psql -v ON_ERROR_STOP=1 --set role="$$role" --set database="$${value%%:*}" --set password="$${value#*:}" <<'SQL'
        SELECT format('CREATE ROLE %I LOGIN', :'role')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role')\gexec
        SELECT format('ALTER ROLE %I PASSWORD %L', :'role', :'password')\gexec
        SELECT format('CREATE DATABASE %I OWNER %I', :'database', :'role')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'database')\gexec
        SELECT format('REVOKE CONNECT ON DATABASE %I FROM PUBLIC', :'database')\gexec
        SQL
        done
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: initializer
      PGDATABASE: initializer
      PGPASSWORD: ${INITIALIZER_PG_PASSWORD:-change-me-local-only}
      # PG_ROLE_<role>: <database>:<password>, one line per backend and per Kratos.
  # initializer:end identity|multi

  # initializer:stack go-srv
  # initializer:end go-srv
  # initializer:module identity|multi
      PG_ROLE_initializer: initializer:${INITIALIZER_PG_PASSWORD:-change-me-local-only}
  # initializer:end identity|multi
  # initializer:module identity
      PG_ROLE_kratos: kratos:${KRATOS_PG_PASSWORD:-change-me-local-only-kratos}
  # initializer:end identity

  # initializer:stack go-srv
  # Built from its component folder, behind profile app: `up -d` alone starts infrastructure only.
  # The project root is mounted read-only so relative config paths resolve as in host-dev.
  go-srv:
    build: ../../go-srv
    profiles: [app]
    depends_on:
      postgres:
        condition: service_healthy
  # initializer:end go-srv
  # initializer:module identity|multi
      postgres-init:
        condition: service_completed_successfully
  # initializer:end identity|multi
  # initializer:module identity
      kratos:
        condition: service_started
  # initializer:end identity
  # initializer:stack go-srv
    working_dir: /project/go-srv
    volumes:
      - ../..:/project:ro
    env_file:
      - path: ./.example.env
      - path: ./.env
        required: false
    environment:
      GO_SRV_ADDR: ":10100"
      APP_DATABASE_URL: postgres://initializer:${INITIALIZER_PG_PASSWORD:-change-me-local-only}@postgres:5432/initializer?sslmode=disable
  # initializer:end go-srv
  # initializer:module identity
      APP_KRATOS_PUBLIC_URL: http://kratos:4433
      APP_KRATOS_ADMIN_URL: http://kratos:4434
  # initializer:end identity
  # initializer:stack go-srv
    ports:
      - "127.0.0.1:10100:10100"
  # initializer:end go-srv
  # initializer:module identity

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    depends_on:
      postgres-init:
        condition: service_completed_successfully
    environment:
      DSN: postgres://kratos:${KRATOS_PG_PASSWORD:-change-me-local-only-kratos}@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
    volumes:
      - ./kratos:/etc/config/kratos:ro
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    restart: "no"

  kratos:
    image: oryd/kratos:v26.2.0
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    environment:
      DSN: postgres://kratos:${KRATOS_PG_PASSWORD:-change-me-local-only-kratos}@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
      SERVE_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:10120}/kratos/
      SELFSERVICE_DEFAULT_BROWSER_RETURN_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:10120}/
    ports:
      - "127.0.0.1:10133:4433"
      - "127.0.0.1:10134:4434"
    volumes:
      - ./kratos:/etc/config/kratos:ro
    # --dev only in this local file (L11); --sqa-opt-out stops recurring telemetry.
    command: serve -c /etc/config/kratos/kratos.yml --dev --sqa-opt-out
    restart: unless-stopped
  # initializer:end identity

  # initializer:stack ng-web
  ng-web:
    build: ../../ng-web
    profiles: [app]
  # initializer:end ng-web
  # initializer:stack go-srv
    depends_on:
      go-srv:
        condition: service_started
    environment:
      GO_SRV_HOST: go-srv:10100
  # initializer:end go-srv
  # initializer:stack ng-web
    ports:
      - "127.0.0.1:10120:80"
  # initializer:end ng-web

volumes:
  postgres-data:
