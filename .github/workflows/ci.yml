name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of oasdiff_1.34.1_linux_amd64.tar.gz: 75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90
  OASDIFF_VERSION: 1.34.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          curl -sSfL -o "${RUNNER_TEMP}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "${RUNNER_TEMP}"
          grep " ${archive}\$" checksums.txt | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
      - name: Scan full history
        run: gitleaks git --redact --verbose --exit-code 1 .

  go-go-srv:
    name: go (go-srv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-srv
    env:
      APP_TEST_DATABASE_URL: postgres://initializer@localhost:10132/initializer?sslmode=disable
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: initializer
          POSTGRES_USER: initializer
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["10132:5432"]
        options: >-
          --health-cmd "pg_isready -U initializer -d initializer"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-srv/go.mod
          cache-dependency-path: go-srv/go.mod
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # -race needs cgo and a C compiler, which ubuntu-latest has and the local Windows setup lacks.
      - name: Test
        run: go test -race ./...

  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/gates/go.mod
          cache-dependency-path: tooling/gates/go.sum
      - name: Install oasdiff
        run: |
          set -euo pipefail
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          curl -sSfL -o "${RUNNER_TEMP}/checksums.txt" "${base}/checksums.txt"
          cd "${RUNNER_TEMP}"
          grep " ${archive}\$" checksums.txt | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/oasdiff-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/oasdiff-bin" oasdiff
          echo "${RUNNER_TEMP}/oasdiff-bin" >> "${GITHUB_PATH}"
      - name: Format
        working-directory: tooling/gates
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}"
            exit 1
          fi
      - name: Vet
        run: go -C tooling/gates vet ./...
      - name: Test
        run: go -C tooling/gates test ./...
      - name: Check flags.yaml, migrations, contracts and versions
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="origin/main"
          if [ -n "${PR_BASE_SHA}" ]; then
            base="${PR_BASE_SHA}"
          elif [ -n "${PUSH_BEFORE_SHA}" ] && [ -n "${PUSH_BEFORE_SHA//0/}" ]; then
            base="${PUSH_BEFORE_SHA}"
          fi
          go -C tooling/gates run ./cmd/gates flags --root "${GITHUB_WORKSPACE}" --base-rev "${base}"
          go -C tooling/gates run ./cmd/gates migrations --root "${GITHUB_WORKSPACE}" --base-rev "${base}"
          go -C tooling/gates run ./cmd/gates contracts --root "${GITHUB_WORKSPACE}" --base-rev "${base}"
          go -C tooling/gates run ./cmd/gates versions --root "${GITHUB_WORKSPACE}" --base-rev "${base}"
          go -C tooling/gates run ./cmd/gates tags --root "${GITHUB_WORKSPACE}" > /dev/null

  generator:
    name: generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/generator/go.mod
      - name: Format
        working-directory: tooling/generator
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}"
            exit 1
          fi
      - name: Vet
        run: go -C tooling/generator vet ./...
      - name: Test
        run: go -C tooling/generator test ./...
      - name: Build the catalog twice and compare
        run: |
          set -euo pipefail
          git ls-files -z > "${RUNNER_TEMP}/files.bin"
          for out in catalog.lock.json catalog-2.lock.json; do
            go -C tooling/generator run ./cmd/initializer catalog build               --root "${GITHUB_WORKSPACE}"               --files "${RUNNER_TEMP}/files.bin"               --out "${RUNNER_TEMP}/${out}"
          done
          cmp "${RUNNER_TEMP}/catalog.lock.json" "${RUNNER_TEMP}/catalog-2.lock.json"
      - name: Reference round-trip
        run: |
          set -euo pipefail
          ref="${RUNNER_TEMP}/ref"
          go -C tooling/generator run ./cmd/initializer generate \
            --root "${GITHUB_WORKSPACE}" \
            --catalog "${RUNNER_TEMP}/catalog.lock.json" \
            --out "${ref}" \
            -f "${GITHUB_WORKSPACE}/.initializer/reference.json" --all-modules \
            --go-module "$(head -1 go-srv/go.mod | cut -d' ' -f2)"
          jq -e --slurpfile catalog "${RUNNER_TEMP}/catalog.lock.json" '
            (.components | length) == 2
            and (.components | all(.name == .stack))
            and (.names | has("service.postgres"))
            and (.names | to_entries | all(.value == $catalog[0].reference[.key]))' "${ref}/initializer.lock.json" > /dev/null \
            || { echo "the reference generation did not use the reference names" >&2; exit 1; }
          # Rendered files and target-delivered files differ from the repository by design.
          status=0
          compared=0
          while IFS= read -r file; do
            path="${file#"${ref}/"}"
            case "${path}" in
              README.md|initializer.selection.json|initializer.lock.json|flags.yaml) continue ;;
            esac
            compared=$((compared + 1))
            if ! cmp -s "${file}" "${GITHUB_WORKSPACE}/${path}"; then
              echo "round-trip difference: ${path}" >&2
              status=1
            fi
          done < <(find "${ref}" -type f | sort)
          if [ "${compared}" -eq 0 ]; then
            echo "the round-trip compared no file" >&2
            status=1
          fi
          web="$(jq -r '.components[] | select(.stack == "ng-web") | .name' "${ref}/initializer.lock.json")"
          for excluded in "${web}/AGENTS.md" "${web}/cookbooks" "${web}/.vscode"; do
            if [ -e "${ref}/${excluded}" ]; then
              echo "excluded path delivered: ${excluded}" >&2
              status=1
            fi
          done
          exit "${status}"
      - name: Build the component images
        run: |
          set -euo pipefail
          compose="docker compose -f .deploy/local/docker-compose.yml"
          ${compose} config -q
          ${compose} --profile app config -q
          ${compose} --profile app build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-lock
          path: ${{ runner.temp }}/catalog.lock.json
          retention-days: 7

  clone-setup:
    name: clone-setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
      - name: mise install builds the CLI
        run: |
          set -euo pipefail
          status=0
          mise install --dry-run || status=$?
          echo "mise install before mise trust: exit ${status}"
          mise trust
          mise install
          test -x tooling/generator/bin/initializer
          mise exec -- initializer --help
      - name: generate finds its sources from the binary's clone
        run: |
          set -euo pipefail
          bin="${GITHUB_WORKSPACE}/tooling/generator/bin/initializer"
          cd "${RUNNER_TEMP}"
          "${bin}" generate "${RUNNER_TEMP}/demo2" --modules identity
          test -f "${RUNNER_TEMP}/demo2/initializer.lock.json"
          jq -e '.source.commit | test("^[0-9a-f]{40}$")' "${RUNNER_TEMP}/demo2/initializer.lock.json"
      - name: A generated project's mise install runs no hook
        run: |
          set -euo pipefail
          git ls-files -z > "${RUNNER_TEMP}/files.bin"
          bin="${GITHUB_WORKSPACE}/tooling/generator/bin/initializer"
          "${bin}" catalog build --root "${GITHUB_WORKSPACE}" --files "${RUNNER_TEMP}/files.bin" --out "${RUNNER_TEMP}/catalog.lock.json"
          "${bin}" generate --root "${GITHUB_WORKSPACE}" --catalog "${RUNNER_TEMP}/catalog.lock.json" --out "${RUNNER_TEMP}/demo" --name demo --go-module example.com/demo --stacks go-srv --modules identity
          cd "${RUNNER_TEMP}/demo"
          mise trust
          mise install
          test ! -e tooling/generator

  selections:
    name: selections
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the selection files
        id: legs
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tooling/generator/testdata/ci/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no selection files under tooling/generator/testdata/ci" >&2
            exit 1
          fi
          lines=""
          for file in "${files[@]}"; do
            line="$(jq -c --arg name "$(basename "${file}" .json)" '
              (.stacks | index("ng-web") != null) as $web
              | {selection: $name, web: $web,
                 public_base_url: (if $web then "http://localhost:10120" else "http://localhost:10100" end)}' "${file}")"
            lines+="${line}"$'\n'
          done
          legs="$(printf '%s' "${lines}" | jq -sc 'sort_by(.selection)')"
          echo "legs=${legs}" >> "${GITHUB_OUTPUT}"

  generated-project:
    name: generated-project (${{ matrix.selection }})
    needs: [generator, selections]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.selections.outputs.legs) }}
    env:
      CI: "true"
      APP_PUBLIC_BASE_URL: ${{ matrix.public_base_url }}
      TCK_BASE_URL: ${{ matrix.public_base_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-srv/go.mod
          cache-dependency-path: go-srv/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: specs/package.json
          cache: npm
          cache-dependency-path: |
            specs/package-lock.json
            ng-web/package-lock.json
            initializer-e2e/package-lock.json
      - name: Build the CLI and the catalog
        run: |
          set -euo pipefail
          go -C tooling/generator build -o "${RUNNER_TEMP}/initializer" ./cmd/initializer
          git ls-files -z > "${RUNNER_TEMP}/files.bin"
          "${RUNNER_TEMP}/initializer" catalog build \
            --root "${GITHUB_WORKSPACE}" \
            --files "${RUNNER_TEMP}/files.bin" \
            --out "${RUNNER_TEMP}/catalog.lock.json"
      - name: Generate twice, compare and verify
        run: |
          set -euo pipefail
          for name in gen-a gen-b; do
            "${RUNNER_TEMP}/initializer" generate \
              --root "${GITHUB_WORKSPACE}" \
              --catalog "${RUNNER_TEMP}/catalog.lock.json" \
              --selection "${GITHUB_WORKSPACE}/tooling/generator/testdata/ci/${{ matrix.selection }}.json" \
              --out "${RUNNER_TEMP}/${name}"
          done
          diff -r "${RUNNER_TEMP}/gen-a" "${RUNNER_TEMP}/gen-b"
          "${RUNNER_TEMP}/initializer" verify --project "${RUNNER_TEMP}/gen-a"
      - name: Read the project layout from the lock
        id: layout
        env:
          WEB: ${{ matrix.web }}
        run: |
          set -euo pipefail
          lock="${RUNNER_TEMP}/gen-a/initializer.lock.json"
          one() {
            jq -r --arg stack "$1" '[.components[] | select(.stack == $stack) | .name] | if length == 1 then .[0] else empty end' "${lock}"
          }
          srv="$(one go-srv)"
          web="$(one ng-web)"
          if [ -z "${srv}" ]; then
            echo "the lock names no single go-srv component" >&2
            exit 1
          fi
          if [ "${WEB}" = "true" ] && [ -z "${web}" ]; then
            echo "the leg selects ng-web but the lock names no single ng-web component" >&2
            exit 1
          fi
          if [ "${WEB}" != "true" ] && [ -n "${web}" ]; then
            echo "the lock names an ng-web component the leg does not select" >&2
            exit 1
          fi
          postgres="$(jq -r '.names["service.postgres"] // empty' "${lock}")"
          if [ -z "${postgres}" ]; then
            echo "the lock names no postgres service" >&2
            exit 1
          fi
          {
            echo "srv=${srv}"
            echo "web=${web}"
            echo "postgres=${postgres}"
          } >> "${GITHUB_OUTPUT}"
      - name: The source module path is gone
        run: |
          set -euo pipefail
          source_module="$(head -1 go-srv/go.mod | cut -d' ' -f2)"
          if grep -rF "${source_module}" "${RUNNER_TEMP}/gen-a"; then
            echo "the source module path leaked into the generated project" >&2
            exit 1
          fi
      - name: Delivered files of absent modules and specs are absent
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/gen-a"
          catalog="${RUNNER_TEMP}/catalog.lock.json"
          lock="${project}/initializer.lock.json"
          installed="$(jq -c '[.modules[] | "\(.stack)/\(.module)"]' "${lock}")"
          specs="$(jq -c '[.specs[].spec]' "${lock}")"
          folders="$(jq -c '[.components[] | {key: .stack, value: .name}] | from_entries' "${lock}")"
          mapping='
            def project_path: . as $p
              | ([$folders | to_entries[] | select(. as $e | $p | startswith($e.key + "/"))] | first) as $f
              | if $f == null then $p else $f.value + "/" + ($p | ltrimstr($f.key + "/")) end;'
          absent="$(jq -r --argjson installed "${installed}" --argjson specs "${specs}" --argjson folders "${folders}" "${mapping}"'
            (.stacks[] | .stack as $stack | .modules[]
               | select(("\($stack)/\(.module)") as $key | $installed | index($key) | not)
               | .files[] | (.target // .path) | project_path),
            (.specs[] | select(.spec as $s | $specs | index($s) | not) | .files[] | (.target // .path))' "${catalog}")"
          present="$(jq -r --argjson installed "${installed}" --argjson folders "${folders}" "${mapping}"'
            .stacks[] | .stack as $stack | .modules[]
              | select(("\($stack)/\(.module)") as $key | $installed | index($key))
              | .files[] | (.target // .path) | project_path' "${catalog}")"
          status=0
          while IFS= read -r path; do
            if [ -n "${path}" ] && [ -e "${project}/${path}" ]; then
              echo "file of an absent module or spec delivered: ${path}" >&2
              status=1
            fi
          done <<< "${absent}"
          count=0
          while IFS= read -r path; do
            if [ -n "${path}" ]; then
              count=$((count + 1))
              if [ ! -e "${project}/${path}" ]; then
                echo "mapped path of an installed module is missing: ${path}" >&2
                status=1
              fi
            fi
          done <<< "${present}"
          if [ "${count}" -eq 0 ]; then
            echo "no installed module file was mapped" >&2
            status=1
          fi
          exit "${status}"
      - name: Start the generated project stack
        env:
          POSTGRES: ${{ steps.layout.outputs.postgres }}
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/gen-a"
          cp "${project}/.deploy/local/.example.env" "${project}/.deploy/local/.env"
          compose="docker compose -f ${project}/.deploy/local/docker-compose.yml"
          ${compose} config -q
          ${compose} up -d
          wait_kratos=false
          if jq -e 'any(.modules[]; .module == "identity")' "${project}/initializer.lock.json" > /dev/null; then
            wait_kratos=true
          fi
          for _ in $(seq 1 60); do
            state="$(${compose} ps --format json "${POSTGRES}" | jq -rs 'flatten | .[0].Health // empty')"
            if [ "${state}" = "healthy" ]; then
              if [ "${wait_kratos}" = false ] || curl -fsS http://127.0.0.1:10133/health/ready > /dev/null; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "timeout waiting for the generated project stack" >&2
          exit 1
      - name: Format, vet, build and test the generated go-srv
        working-directory: ${{ runner.temp }}/gen-a/${{ steps.layout.outputs.srv }}
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}" >&2
            exit 1
          fi
          go vet ./...
          go build ./...
          database_url="$(. ../.deploy/local/.env; printf '%s' "${APP_DATABASE_URL}")"
          APP_TEST_DATABASE_URL="${database_url}" APP_TEST_PUBLIC_BASE_URL="${APP_PUBLIC_BASE_URL}" go test ./...
      - name: Build and start the generated go-srv
        env:
          SRV: ${{ steps.layout.outputs.srv }}
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/gen-a"
          go -C "${project}/${SRV}" build -o "${RUNNER_TEMP}/go-srv-bin" ./cmd/server
          cd "${project}"
          set -a; . .deploy/local/.env; set +a
          while IFS= read -r pair; do
            export "${pair}"
          done < <(jq -r '.tckEnv | to_entries[] | "\(.key)=\(.value)"' initializer.lock.json)
          export APP_PUBLIC_BASE_URL="${{ matrix.public_base_url }}"
          "${RUNNER_TEMP}/go-srv-bin" > "${RUNNER_TEMP}/go-srv.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/go-srv.pid"
          url=http://localhost:10100/health/ready
          for _ in $(seq 1 60); do
            if curl -fsS "${url}" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for ${url}" >&2
          exit 1
      - name: Lint, build and test the generated ng-web
        if: matrix.web
        working-directory: ${{ runner.temp }}/gen-a/${{ steps.layout.outputs.web }}
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run build
          npm test -- --watch=false
      - name: Start the generated ng-web dev server
        if: matrix.web
        working-directory: ${{ runner.temp }}/gen-a/${{ steps.layout.outputs.web }}
        run: |
          set -euo pipefail
          npm start > "${RUNNER_TEMP}/ng-web.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/ng-web.pid"
          url=http://localhost:10120/
          for _ in $(seq 1 60); do
            if curl -fsS "${url}" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for ${url}" >&2
          exit 1
      - name: Run the console e2e the lock selects
        if: matrix.web
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/gen-a"
          installed() {
            jq -e --arg m "$1" 'any(.modules[]; .module == $m)' "${project}/initializer.lock.json" > /dev/null
          }
          if ! installed identity; then
            e2e_grep='@shell-open'
          elif installed tenancy; then
            echo "multi-tenant console: covered by the repo e2e job"
            exit 0
          else
            e2e_grep='@console-identity'
            if installed api-keys; then
              e2e_grep="${e2e_grep}|@console-platform-keys"
            fi
          fi
          npm --prefix initializer-e2e ci
          (cd initializer-e2e && npx playwright install --with-deps chromium)
          grep -Ev '^(PW_(VIDEO|SCREENSHOT|TRACE)|INIT_START_STACK|INIT_WEB_BASE_URL|INIT_USER_EMAIL|INIT_USER_PASSWORD)=' initializer-e2e/.example.env > initializer-e2e/.env
          email="$(. "${project}/.deploy/local/.env"; printf '%s' "${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}")"
          password="$(. "${project}/.deploy/local/.env"; printf '%s' "${APP_BOOTSTRAP_ADMIN_PASSWORD:-change-me-local-only}")"
          printf 'INIT_WEB_BASE_URL=http://localhost:10120\nINIT_USER_EMAIL=%s\nINIT_USER_PASSWORD=%s\n' "${email}" "${password}" >> initializer-e2e/.env
          (cd initializer-e2e && npx playwright test tests/e2e/console --grep "${e2e_grep}")
      - name: Run the TCK the lock selects
        working-directory: ${{ runner.temp }}/gen-a/specs
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          locked="$(jq -r '.tckTags | join(",")' ../initializer.lock.json)"
          installed="$(jq -rs '[.[].tckTags[]] | unique | join(",")' */spec.manifest.json)"
          if [ "${locked}" != "${installed}" ]; then
            echo "installed tags ${installed} differ from the lock ${locked}" >&2
            exit 1
          fi
          npm run tck
      - name: Check the specs the lock selects
        working-directory: ${{ runner.temp }}/gen-a/specs
        run: |
          set -euo pipefail
          # The two TCK passes write one junit file, so the selected tests are counted from the lock's grep.
          grep_pattern="$(jq -r .tckGrep ../initializer.lock.json)"
          invert="$(jq -r '.tckGrepInvert // ""' ../initializer.lock.json)"
          args=(--grep "${grep_pattern}")
          if [ -n "${invert}" ]; then
            args+=(--grep-invert "${invert}")
          fi
          npx playwright test --list --reporter=list "${args[@]}" > "${RUNNER_TEMP}/tck-list.txt"
          # Every spec in the lock has tests; uninstalled specs are absent (see the absence step).
          for spec in $(jq -r '.specs[].spec' ../initializer.lock.json); do
            count="$(grep -c " ${spec}/tck/" "${RUNNER_TEMP}/tck-list.txt" || true)"
            echo "${spec}: ${count} tests"
            test "${count}" -gt 0
          done
      - name: Collect logs
        if: always()
        run: |
          docker compose -f "${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml" logs --no-color > "${RUNNER_TEMP}/compose.log" 2>&1 || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-${{ matrix.selection }}
          path: |
            ${{ runner.temp }}/gen-a/specs/test-results/
            ${{ runner.temp }}/gen-a/specs/playwright-report/
            initializer-e2e/playwright-report/
            initializer-e2e/test-results/
            ${{ runner.temp }}/go-srv.log
            ${{ runner.temp }}/ng-web.log
            ${{ runner.temp }}/compose.log
            ${{ runner.temp }}/tck-list.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Stop go-srv and the stack
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/go-srv.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/go-srv.pid")" || true
          fi
          if [ -f "${RUNNER_TEMP}/ng-web.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/ng-web.pid")" || true
          fi
          if [ -f "${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml" ]; then
            docker compose -f "${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml" down -v
          fi

  generated-projects:
    name: generated-projects
    needs: [selections, generated-project]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every generated-project leg passed
        run: |
          test "${{ needs.selections.result }}" = success
          test "${{ needs.generated-project.result }}" = success

  tck:
    name: tck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      APP_PUBLIC_BASE_URL: http://localhost:10100
      TCK_BASE_URL: http://localhost:10100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-srv/go.mod
          cache-dependency-path: go-srv/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: specs/package.json
          cache: npm
          cache-dependency-path: specs/package-lock.json
      - name: Install and check the TCK runner
        working-directory: specs
        run: |
          npm ci
          npm run typecheck
          npm run check:tags
          npm run test:scripts
      - name: Prepare the local stack env
        run: cp .deploy/local/.example.env .deploy/local/.env
      - name: Start the local stack
        run: |
          set -euo pipefail
          compose="docker compose -f .deploy/local/docker-compose.yml"
          ${compose} up -d
          for _ in $(seq 1 60); do
            state="$(${compose} ps --format json postgres | jq -rs 'flatten | .[0].Health // empty')"
            if [ "${state}" = "healthy" ] && curl -fsS http://localhost:10133/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for the local stack" >&2
          exit 1
      - name: Build and start go-srv
        run: |
          set -euo pipefail
          go -C go-srv build -o "${RUNNER_TEMP}/go-srv" ./cmd/server
          set -a; . .deploy/local/.env; set +a
          export APP_PUBLIC_BASE_URL=http://localhost:10100
          eval "$(node specs/scripts/tck-env.mjs)"
          "${RUNNER_TEMP}/go-srv" > "${RUNNER_TEMP}/go-srv.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/go-srv.pid"
          url=http://localhost:10100/health/ready
          for _ in $(seq 1 60); do
            if curl -fsS "${url}" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for ${url}" >&2
          exit 1
      - name: Run the TCK
        working-directory: specs
        run: npm run tck
      - name: Collect logs
        if: always()
        run: |
          docker compose -f .deploy/local/docker-compose.yml logs --no-color > "${RUNNER_TEMP}/compose.log" 2>&1 || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tck-${{ github.run_id }}
          path: |
            specs/test-results/
            ${{ runner.temp }}/go-srv.log
            ${{ runner.temp }}/compose.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop go-srv and the stack
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/go-srv.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/go-srv.pid")" || true
          fi
          docker compose -f .deploy/local/docker-compose.yml down -v

  node-ng-web:
    name: node (ng-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ng-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ng-web/package.json
          cache: npm
          cache-dependency-path: ng-web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --watch=false


  node-initializer-e2e:
    name: node (initializer-e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: initializer-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: initializer-e2e/package.json
          cache: npm
          cache-dependency-path: initializer-e2e/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: CI artifact capture guard
        run: npx playwright test tests/smoke/ci-artifact-capture.spec.ts

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      INIT_START_STACK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-srv/go.mod
          cache-dependency-path: go-srv/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: initializer-e2e/package.json
          cache: npm
          cache-dependency-path: |
            ng-web/package-lock.json
            initializer-e2e/package-lock.json
      - name: Install ng-web and the e2e suite
        run: |
          set -euo pipefail
          npm --prefix ng-web ci
          npm --prefix initializer-e2e ci
          (cd initializer-e2e && npx playwright install --with-deps chromium)
      - name: Prepare the env files
        run: |
          set -euo pipefail
          cp .deploy/local/.example.env .deploy/local/.env
          grep -Ev '^PW_(VIDEO|SCREENSHOT|TRACE)=' initializer-e2e/.example.env > initializer-e2e/.env
      - name: Start the local stack
        run: |
          set -euo pipefail
          compose="docker compose -f .deploy/local/docker-compose.yml"
          ${compose} up -d
          for _ in $(seq 1 60); do
            state="$(${compose} ps --format json postgres | jq -rs 'flatten | .[0].Health // empty')"
            if [ "${state}" = "healthy" ] && curl -fsS http://localhost:10133/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for the local stack" >&2
          exit 1
      - name: Create the e2e database
        run: |
          set -euo pipefail
          docker compose -f .deploy/local/docker-compose.yml exec -T postgres psql -U initializer -d postgres -c 'CREATE DATABASE it_e2e_platform'
      - name: Run the platform e2e
        working-directory: initializer-e2e
        run: npx playwright test tests/e2e/platform
      - name: Collect logs
        if: always()
        run: |
          docker compose -f .deploy/local/docker-compose.yml logs --no-color > "${RUNNER_TEMP}/compose.log" 2>&1 || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ github.run_id }}
          path: |
            initializer-e2e/playwright-report/
            initializer-e2e/test-results/
            ${{ runner.temp }}/compose.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose -f .deploy/local/docker-compose.yml down -v
