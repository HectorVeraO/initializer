name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of oasdiff_1.34.1_linux_amd64.tar.gz: 75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90
  OASDIFF_VERSION: 1.34.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          curl -sSfL -o "${RUNNER_TEMP}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "${RUNNER_TEMP}"
          grep " ${archive}\$" checksums.txt | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
      - name: Scan full history
        run: gitleaks git --redact --verbose --exit-code 1 .

  go-go-srv:
    name: go (go-srv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-srv
    env:
      APP_TEST_DATABASE_URL: postgres://initializer@localhost:10132/initializer?sslmode=disable
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: initializer
          POSTGRES_USER: initializer
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["10132:5432"]
        options: >-
          --health-cmd "pg_isready -U initializer -d initializer"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-srv/go.mod
          cache-dependency-path: go-srv/go.mod
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # -race needs cgo and a C compiler, which ubuntu-latest has and the local Windows setup lacks.
      - name: Test
        run: go test -race ./...

  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/gates/go.mod
          cache-dependency-path: tooling/gates/go.sum
      - name: Install oasdiff
        run: |
          set -euo pipefail
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          curl -sSfL -o "${RUNNER_TEMP}/checksums.txt" "${base}/checksums.txt"
          cd "${RUNNER_TEMP}"
          grep " ${archive}\$" checksums.txt | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/oasdiff-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/oasdiff-bin" oasdiff
          echo "${RUNNER_TEMP}/oasdiff-bin" >> "${GITHUB_PATH}"
      - name: Format
        working-directory: tooling/gates
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}"
            exit 1
          fi
      - name: Vet
        run: go -C tooling/gates vet ./...
      - name: Test
        run: go -C tooling/gates test ./...
      - name: Check flags.yaml, migrations, contracts and versions
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="origin/main"
          if [ -n "${PR_BASE_SHA}" ]; then
            base="${PR_BASE_SHA}"
          elif [ -n "${PUSH_BEFORE_SHA}" ] && [ -n "${PUSH_BEFORE_SHA//0/}" ]; then
            base="${PUSH_BEFORE_SHA}"
          fi
          go -C tooling/gates run ./cmd/gates flags --root "${GITHUB_WORKSPACE}" --base-rev "${base}"
          go -C tooling/gates run ./cmd/gates migrations --root "${GITHUB_WORKSPACE}" --base-rev "${base}"
          go -C tooling/gates run ./cmd/gates contracts --root "${GITHUB_WORKSPACE}" --base-rev "${base}"
          go -C tooling/gates run ./cmd/gates versions --root "${GITHUB_WORKSPACE}" --base-rev "${base}"
          go -C tooling/gates run ./cmd/gates tags --root "${GITHUB_WORKSPACE}" > /dev/null

  generator:
    name: generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/generator/go.mod
      - name: Format
        working-directory: tooling/generator
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}"
            exit 1
          fi
      - name: Vet
        run: go -C tooling/generator vet ./...
      - name: Test
        run: go -C tooling/generator test ./...
      - name: Build the catalog twice and compare
        run: |
          set -euo pipefail
          git ls-files -z > "${RUNNER_TEMP}/files.bin"
          for out in catalog.lock.json catalog-2.lock.json; do
            go -C tooling/generator run ./cmd/initializer catalog build               --root "${GITHUB_WORKSPACE}"               --files "${RUNNER_TEMP}/files.bin"               --out "${RUNNER_TEMP}/${out}"
          done
          cmp "${RUNNER_TEMP}/catalog.lock.json" "${RUNNER_TEMP}/catalog-2.lock.json"
      - name: Reference round-trip
        run: |
          set -euo pipefail
          ref="${RUNNER_TEMP}/ref"
          go -C tooling/generator run ./cmd/initializer generate \
            --root "${GITHUB_WORKSPACE}" \
            --catalog "${RUNNER_TEMP}/catalog.lock.json" \
            -f "${GITHUB_WORKSPACE}/.initializer/reference.json" --all-modules \
            --go-module "$(head -1 go-srv/go.mod | cut -d' ' -f2)" \
            "${ref}"
          jq -e --slurpfile catalog "${RUNNER_TEMP}/catalog.lock.json" '
            (.components | length) == 2
            and (.components | all(.name == .stack))
            and (.names | has("service.postgres"))
            and (.names | to_entries | all(.value == $catalog[0].reference[.key]))' "${ref}/initializer.lock.json" > /dev/null \
            || { echo "the reference generation did not use the reference names" >&2; exit 1; }
          # Rendered files and target-delivered files differ from the repository by design.
          status=0
          compared=0
          while IFS= read -r file; do
            path="${file#"${ref}/"}"
            case "${path}" in
              README.md|initializer.selection.json|initializer.lock.json|flags.yaml) continue ;;
            esac
            compared=$((compared + 1))
            expected="${GITHUB_WORKSPACE}/${path}"
            if [ "${path}" = ".deploy/local/docker-compose.yml" ]; then
              # The delivered compose project is "<project>-<band>"; the repository copy keeps the bare name.
              expected="${RUNNER_TEMP}/compose-expected.yml"
              sed 's/^name: initializer$/name: initializer-101/' "${GITHUB_WORKSPACE}/${path}" > "${expected}"
            fi
            if ! cmp -s "${file}" "${expected}"; then
              echo "round-trip difference: ${path}" >&2
              status=1
            fi
          done < <(find "${ref}" -type f | sort)
          if [ "${compared}" -eq 0 ]; then
            echo "the round-trip compared no file" >&2
            status=1
          fi
          web="$(jq -r '.components[] | select(.stack == "ng-web") | .name' "${ref}/initializer.lock.json")"
          for excluded in "${web}/AGENTS.md" "${web}/cookbooks" "${web}/.vscode"; do
            if [ -e "${ref}/${excluded}" ]; then
              echo "excluded path delivered: ${excluded}" >&2
              status=1
            fi
          done
          exit "${status}"
      - name: Build the component images
        run: |
          set -euo pipefail
          compose="docker compose -f .deploy/local/docker-compose.yml"
          ${compose} config -q
          ${compose} --profile app config -q
          ${compose} --profile app build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-lock
          path: ${{ runner.temp }}/catalog.lock.json
          retention-days: 7

  clone-setup:
    name: clone-setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
      - name: mise install builds the CLI
        run: |
          set -euo pipefail
          status=0
          mise install --dry-run || status=$?
          echo "mise install before mise trust: exit ${status}"
          mise trust
          mise install
          test -x tooling/generator/bin/initializer
          mise exec -- initializer --help
      - name: generate finds its sources from the binary's clone
        run: |
          set -euo pipefail
          bin="${GITHUB_WORKSPACE}/tooling/generator/bin/initializer"
          cd "${RUNNER_TEMP}"
          "${bin}" generate "${RUNNER_TEMP}/demo2" --modules identity
          test -f "${RUNNER_TEMP}/demo2/initializer.lock.json"
          jq -e '.source.commit | test("^[0-9a-f]{40}$")' "${RUNNER_TEMP}/demo2/initializer.lock.json"
      - name: A generated project's mise install runs no hook
        run: |
          set -euo pipefail
          git ls-files -z > "${RUNNER_TEMP}/files.bin"
          bin="${GITHUB_WORKSPACE}/tooling/generator/bin/initializer"
          "${bin}" catalog build --root "${GITHUB_WORKSPACE}" --files "${RUNNER_TEMP}/files.bin" --out "${RUNNER_TEMP}/catalog.lock.json"
          "${bin}" generate --root "${GITHUB_WORKSPACE}" --catalog "${RUNNER_TEMP}/catalog.lock.json" "${RUNNER_TEMP}/demo" --name demo --go-module example.com/demo --stacks go-srv --modules identity
          cd "${RUNNER_TEMP}/demo"
          mise trust
          mise install
          test ! -e tooling/generator

  selections:
    name: selections
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.legs.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the selection files
        id: legs
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tooling/generator/testdata/ci/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no selection files under tooling/generator/testdata/ci" >&2
            exit 1
          fi
          lines=""
          for file in "${files[@]}"; do
            line="$(jq -c --arg name "$(basename "${file}" .json)" '
              (.stacks | index("ng-web") != null) as $web
              | ((.ports.band // 101) * 100) as $base
              | (((.components // []) | map(select(.stack == "go-srv")) | length) > 1) as $multi
              | {selection: $name, web: $web, multi: $multi,
                 public_base_url: (if $multi then "" else "http://localhost:\($base + (if $web then 20 else 0 end))" end),
                 kratos_url: "http://127.0.0.1:\($base + 33)"}' "${file}")"
            lines+="${line}"$'\n'
          done
          legs="$(printf '%s' "${lines}" | jq -sc 'sort_by(.selection)')"
          echo "legs=${legs}" >> "${GITHUB_OUTPUT}"

  generated-project:
    name: generated-project (${{ matrix.selection }})
    needs: [generator, selections]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.selections.outputs.legs) }}
    env:
      CI: "true"
      APP_PUBLIC_BASE_URL: ${{ matrix.public_base_url }}
      TCK_BASE_URL: ${{ matrix.public_base_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-srv/go.mod
          cache-dependency-path: go-srv/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: specs/package.json
          cache: npm
          cache-dependency-path: |
            specs/package-lock.json
            ng-web/package-lock.json
            initializer-e2e/package-lock.json
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        if: matrix.multi
        with:
          install: false
          cache: false
          working_directory: ${{ runner.temp }}
      - name: Build the CLI and the catalog
        run: |
          set -euo pipefail
          go -C tooling/generator build -o "${RUNNER_TEMP}/initializer" ./cmd/initializer
          git ls-files -z > "${RUNNER_TEMP}/files.bin"
          "${RUNNER_TEMP}/initializer" catalog build \
            --root "${GITHUB_WORKSPACE}" \
            --files "${RUNNER_TEMP}/files.bin" \
            --out "${RUNNER_TEMP}/catalog.lock.json"
      - name: Generate twice, compare and verify
        run: |
          set -euo pipefail
          for name in gen-a gen-b; do
            "${RUNNER_TEMP}/initializer" generate \
              --root "${GITHUB_WORKSPACE}" \
              --catalog "${RUNNER_TEMP}/catalog.lock.json" \
              -f "${GITHUB_WORKSPACE}/tooling/generator/testdata/ci/${{ matrix.selection }}.json" \
              "${RUNNER_TEMP}/${name}"
          done
          diff -r "${RUNNER_TEMP}/gen-a" "${RUNNER_TEMP}/gen-b"
          "${RUNNER_TEMP}/initializer" verify "${RUNNER_TEMP}/gen-a"
      - name: Read the project layout from the lock
        id: layout
        env:
          WEB: ${{ matrix.web }}
          MULTI: ${{ matrix.multi }}
        run: |
          set -euo pipefail
          lock="${RUNNER_TEMP}/gen-a/initializer.lock.json"
          names_of() {
            jq -r --arg stack "$1" '[.components[] | select(.stack == $stack) | .name] | join(" ")' "${lock}"
          }
          backends="$(names_of go-srv)"
          frontends="$(names_of ng-web)"
          backend_count="$(wc -w <<< "${backends}")"
          frontend_count="$(wc -w <<< "${frontends}")"
          if [ "${MULTI}" = true ] && [ "${backend_count}" -lt 2 ]; then
            echo "the leg selects several backends but the lock names ${backend_count}" >&2
            exit 1
          fi
          if [ "${MULTI}" != true ] && [ "${backend_count}" -ne 1 ]; then
            echo "the lock names no single go-srv component" >&2
            exit 1
          fi
          if [ "${WEB}" = "true" ] && [ "${frontend_count}" -ne 1 ]; then
            echo "the leg selects ng-web but the lock names ${frontend_count} ng-web components" >&2
            exit 1
          fi
          if [ "${WEB}" != "true" ] && [ "${frontend_count}" -ne 0 ]; then
            echo "the lock names an ng-web component the leg does not select" >&2
            exit 1
          fi
          # The postgres service of each backend: its own entry in a multi lock, the top-level name in a single one.
          postgres=""
          for name in ${backends}; do
            if [ "${MULTI}" = true ]; then
              service="$(jq -r --arg n "${name}" '.components[] | select(.name == $n) | .names["service.postgres"] // empty' "${lock}")"
            else
              service="$(jq -r '.names["service.postgres"] // empty' "${lock}")"
            fi
            if [ -z "${service}" ]; then
              echo "the lock names no postgres service for ${name}" >&2
              exit 1
            fi
            postgres="${postgres:+${postgres} }${service}"
          done
          {
            echo "backends=${backends}"
            echo "frontends=${frontends}"
            echo "postgres=${postgres}"
          } >> "${GITHUB_OUTPUT}"
          if [ "${MULTI}" != true ]; then
            {
              echo "srv=${backends}"
              echo "web=${frontends}"
            } >> "${GITHUB_OUTPUT}"
          fi
      - name: The source module path is gone
        run: |
          set -euo pipefail
          source_module="$(head -1 go-srv/go.mod | cut -d' ' -f2)"
          if grep -rF "${source_module}" "${RUNNER_TEMP}/gen-a"; then
            echo "the source module path leaked into the generated project" >&2
            exit 1
          fi
      - name: Delivered files of absent modules and specs are absent
        if: ${{ !matrix.multi }}
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/gen-a"
          catalog="${RUNNER_TEMP}/catalog.lock.json"
          lock="${project}/initializer.lock.json"
          installed="$(jq -c '[.modules[] | "\(.stack)/\(.module)"]' "${lock}")"
          specs="$(jq -c '[.specs[].spec]' "${lock}")"
          folders="$(jq -c '[.components[] | {key: .stack, value: .name}] | from_entries' "${lock}")"
          mapping='
            def project_path: . as $p
              | ([$folders | to_entries[] | select(. as $e | $p | startswith($e.key + "/"))] | first) as $f
              | if $f == null then $p else $f.value + "/" + ($p | ltrimstr($f.key + "/")) end;'
          absent="$(jq -r --argjson installed "${installed}" --argjson specs "${specs}" --argjson folders "${folders}" "${mapping}"'
            (.stacks[] | .stack as $stack | .modules[]
               | select(("\($stack)/\(.module)") as $key | $installed | index($key) | not)
               | .files[] | (.target // .path) | project_path),
            (.specs[] | select(.spec as $s | $specs | index($s) | not) | .files[] | (.target // .path))' "${catalog}")"
          present="$(jq -r --argjson installed "${installed}" --argjson folders "${folders}" "${mapping}"'
            .stacks[] | .stack as $stack | .modules[]
              | select(("\($stack)/\(.module)") as $key | $installed | index($key))
              | .files[] | (.target // .path) | project_path' "${catalog}")"
          status=0
          while IFS= read -r path; do
            if [ -n "${path}" ] && [ -e "${project}/${path}" ]; then
              echo "file of an absent module or spec delivered: ${path}" >&2
              status=1
            fi
          done <<< "${absent}"
          count=0
          while IFS= read -r path; do
            if [ -n "${path}" ]; then
              count=$((count + 1))
              if [ ! -e "${project}/${path}" ]; then
                echo "mapped path of an installed module is missing: ${path}" >&2
                status=1
              fi
            fi
          done <<< "${present}"
          if [ "${count}" -eq 0 ]; then
            echo "no installed module file was mapped" >&2
            status=1
          fi
          exit "${status}"
      - name: Start the generated project stack
        env:
          MULTI: ${{ matrix.multi }}
          BACKENDS: ${{ steps.layout.outputs.backends }}
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/gen-a"
          lock="${project}/initializer.lock.json"
          compose="docker compose -f ${project}/.deploy/local/docker-compose.yml"
          # TCK env as KEY=VALUE lines, as the backend reads it from its component folder.
          env_lines='to_entries[]
            | .value as $v
            | (($v | test("/")) and ($v | test("://") | not) and ($v | startswith("/") | not)) as $rel
            | "\(.key)=\(if $rel then "../" + $v else $v end)"'
          if [ "${MULTI}" = true ]; then
            # Each instance reads its own env file; the public base of each stays the one in its .example.env.
            for name in ${BACKENDS}; do
              jq -r --arg n "${name}" ".components[] | select(.name == \$n) | (.tck.env // {}) | ${env_lines}" "${lock}" >> "${project}/.deploy/local/${name}/.env"
            done
          else
            jq -r ".tckEnv | ${env_lines}" "${lock}" >> "${project}/.deploy/local/.env"
            # The leg's public base wins over the template value in .example.env, for the go-srv container and Kratos.
            printf 'APP_PUBLIC_BASE_URL=%s\n' "${APP_PUBLIC_BASE_URL}" >> "${project}/.deploy/local/.env"
          fi
          ${compose} config -q
          ${compose} --profile app config -q
          ${compose} --profile app up -d --build
          # Ready URLs: every backend's origin, and Kratos for every backend with identity.
          urls=()
          if [ "${MULTI}" = true ]; then
            for name in ${BACKENDS}; do
              urls+=("$(jq -r --arg n "${name}" '.components[] | select(.name == $n) | .origin' "${lock}")/health/ready")
              if jq -e --arg n "${name}" '.components[] | select(.name == $n) | .modules | index("identity")' "${lock}" > /dev/null; then
                urls+=("http://127.0.0.1:$(jq -r --arg n "${name}" '.components[] | select(.name == $n) | .ports["kratos-public"]' "${lock}")/health/ready")
              fi
            done
          else
            urls+=("${TCK_BASE_URL}/health/ready")
            if jq -e 'any(.modules[]; .module == "identity")' "${lock}" > /dev/null; then
              urls+=("${{ matrix.kratos_url }}/health/ready")
            fi
          fi
          for _ in $(seq 1 90); do
            is_ready=true
            for url in "${urls[@]}"; do
              if ! curl -fsS "${url}" > /dev/null; then
                is_ready=false
                break
              fi
            done
            if [ "${is_ready}" = true ]; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for the generated project: ${urls[*]}" >&2
          exit 1
      - name: Format, vet, build and test the generated go-srv
        env:
          MULTI: ${{ matrix.multi }}
          BACKENDS: ${{ steps.layout.outputs.backends }}
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/gen-a"
          for name in ${BACKENDS}; do
            unformatted="$(gofmt -l "${project}/${name}")"
            if [ -n "${unformatted}" ]; then
              echo "${unformatted}" >&2
              exit 1
            fi
            go -C "${project}/${name}" vet ./...
            go -C "${project}/${name}" build ./...
            if [ "${MULTI}" = true ]; then
              # The instance's own template: its database, port and public base.
              env_file="${project}/.deploy/local/${name}/.example.env"
              database_url="$(set -a; . "${env_file}"; printf '%s' "${APP_DATABASE_URL}")"
              public_base_url="$(set -a; . "${env_file}"; printf '%s' "${APP_PUBLIC_BASE_URL:-}")"
              # The instance's own Kratos; the tests default to instance 0's ports.
              kratos_public="$(jq -r --arg n "${name}" '.components[] | select(.name == $n) | .ports["kratos-public"] // empty' "${project}/initializer.lock.json")"
              kratos_admin="$(jq -r --arg n "${name}" '.components[] | select(.name == $n) | .ports["kratos-admin"] // empty' "${project}/initializer.lock.json")"
              if [ -n "${kratos_public}" ]; then
                export APP_TEST_KRATOS_PUBLIC_URL="http://127.0.0.1:${kratos_public}"
                export APP_TEST_KRATOS_ADMIN_URL="http://127.0.0.1:${kratos_admin}"
              fi
            else
              database_url="$(set -a; . "${project}/.deploy/local/.example.env"; printf '%s' "${APP_DATABASE_URL}")"
              public_base_url="${APP_PUBLIC_BASE_URL}"
            fi
            APP_TEST_DATABASE_URL="${database_url}" APP_TEST_PUBLIC_BASE_URL="${public_base_url}" go -C "${project}/${name}" test ./...
          done
      - name: Lint, build and test the generated ng-web
        if: matrix.web
        env:
          FRONTENDS: ${{ steps.layout.outputs.frontends }}
        run: |
          set -euo pipefail
          for name in ${FRONTENDS}; do
            web="${RUNNER_TEMP}/gen-a/${name}"
            npm --prefix "${web}" ci
            npm --prefix "${web}" run lint
            npm --prefix "${web}" run build
            npm --prefix "${web}" test -- --watch=false
          done
      - name: Wait for the console of the multi project to serve
        if: matrix.multi && matrix.web
        env:
          FRONTENDS: ${{ steps.layout.outputs.frontends }}
        run: |
          set -euo pipefail
          lock="${RUNNER_TEMP}/gen-a/initializer.lock.json"
          for name in ${FRONTENDS}; do
            # The frontend is served on the origin of the backend it binds.
            bound="$(jq -r --arg n "${name}" '.components[] | select(.name == $n) | .backend' "${lock}")"
            origin="$(jq -r --arg n "${bound}" '.components[] | select(.name == $n) | .origin' "${lock}")"
            served=false
            for _ in $(seq 1 60); do
              code="$(curl -s -o /dev/null -w '%{http_code}' "${origin}/" || true)"
              if [ "${code}" = 200 ]; then
                served=true
                break
              fi
              sleep 2
            done
            if [ "${served}" != true ]; then
              echo "the console ${name} does not answer 200 on ${origin}/" >&2
              exit 1
            fi
          done
      - name: Run the console e2e the lock selects
        if: matrix.web
        env:
          MULTI: ${{ matrix.multi }}
          FRONTENDS: ${{ steps.layout.outputs.frontends }}
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/gen-a"
          lock="${project}/initializer.lock.json"
          if [ "${MULTI}" = true ]; then
            # The console talks to the backend its frontend binds; the frontend serves that backend's origin.
            bound="$(jq -r --arg n "${FRONTENDS}" '.components[] | select(.name == $n) | .backend' "${lock}")"
            installed_modules="$(jq -c --arg n "${bound}" '.components[] | select(.name == $n) | .modules' "${lock}")"
            web_base_url="$(jq -r --arg n "${bound}" '.components[] | select(.name == $n) | .origin' "${lock}")"
            env_dir="${project}/.deploy/local/${bound}"
          else
            installed_modules="$(jq -c '[.modules[].module]' "${lock}")"
            web_base_url="${TCK_BASE_URL}"
            env_dir="${project}/.deploy/local"
          fi
          installed() {
            jq -e --arg m "$1" 'index($m) != null' <<< "${installed_modules}" > /dev/null
          }
          if ! installed identity; then
            e2e_grep='@shell-open'
          elif installed tenancy; then
            echo "multi-tenant console: covered by the repo e2e job"
            exit 0
          else
            e2e_grep='@console-identity'
            if installed api-keys; then
              e2e_grep="${e2e_grep}|@console-platform-keys"
            fi
          fi
          npm --prefix initializer-e2e ci
          (cd initializer-e2e && npx playwright install --with-deps chromium)
          grep -Ev '^(PW_(VIDEO|SCREENSHOT|TRACE)|INIT_START_STACK|INIT_WEB_BASE_URL|INIT_USER_EMAIL|INIT_USER_PASSWORD)=' initializer-e2e/.example.env > initializer-e2e/.env
          email="$(. "${env_dir}/.example.env"; if [ -f "${env_dir}/.env" ]; then . "${env_dir}/.env"; fi; printf '%s' "${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}")"
          password="$(. "${env_dir}/.example.env"; if [ -f "${env_dir}/.env" ]; then . "${env_dir}/.env"; fi; printf '%s' "${APP_BOOTSTRAP_ADMIN_PASSWORD:-change-me-local-only}")"
          printf 'INIT_WEB_BASE_URL=%s\nINIT_USER_EMAIL=%s\nINIT_USER_PASSWORD=%s\n' "${web_base_url}" "${email}" "${password}" >> initializer-e2e/.env
          (cd initializer-e2e && npx playwright test tests/e2e/console --grep "${e2e_grep}")
      - name: Install the project's tools with mise
        if: matrix.multi
        working-directory: ${{ runner.temp }}/gen-a
        run: |
          set -euo pipefail
          mise trust
          mise install
      - name: Run the TCK the lock selects
        working-directory: ${{ runner.temp }}/gen-a/specs
        env:
          MULTI: ${{ matrix.multi }}
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          # A multi lock records the tags per backend: the installed tags equal their union.
          if [ "${MULTI}" = true ]; then
            locked="$(jq -r '[.components[] | (.tck.tags // [])[]] | unique | join(",")' ../initializer.lock.json)"
          else
            locked="$(jq -r '.tckTags | join(",")' ../initializer.lock.json)"
          fi
          installed="$(jq -rs '[.[].tckTags[]] | unique | join(",")' */spec.manifest.json)"
          if [ "${locked}" != "${installed}" ]; then
            echo "installed tags ${installed} differ from the lock ${locked}" >&2
            exit 1
          fi
          if [ "${MULTI}" != true ]; then
            npm run tck
            exit 0
          fi
          # One TCK per backend that has specs, through the project's mise task.
          tck_backends="$(jq -r '.components[] | select(.stack == "go-srv" and ((.tck.tags // []) | length) > 0) | .name' ../initializer.lock.json)"
          if [ -z "${tck_backends}" ]; then
            echo "the multi lock names no backend with a TCK" >&2
            exit 1
          fi
          for name in ${tck_backends}; do
            (cd .. && mise run "tck:${name}")
          done
      - name: Check the specs the lock selects
        working-directory: ${{ runner.temp }}/gen-a/specs
        env:
          MULTI: ${{ matrix.multi }}
        run: |
          set -euo pipefail
          lock=../initializer.lock.json
          # The TCK passes write one junit file, so the selected tests are counted from the lock's grep.
          check_grep() {
            local grep_pattern="$1" invert="$2" label="$3" specs="$4"
            local args=(--grep "${grep_pattern}")
            if [ -n "${invert}" ]; then
              args+=(--grep-invert "${invert}")
            fi
            # --list never calls the instance; the config only needs a non-empty base URL (a multi leg sets none).
            TCK_BASE_URL="${TCK_BASE_URL:-http://localhost:10100}" npx playwright test --list --reporter=list "${args[@]}" > "${RUNNER_TEMP}/tck-list-${label}.txt"
            # Every spec in the selection has tests; uninstalled specs are absent (see the absence step).
            for spec in ${specs}; do
              count="$(grep -c " ${spec}/tck/" "${RUNNER_TEMP}/tck-list-${label}.txt" || true)"
              echo "${label} ${spec}: ${count} tests"
              test "${count}" -gt 0
            done
          }
          if [ "${MULTI}" != true ]; then
            check_grep "$(jq -r .tckGrep "${lock}")" "$(jq -r '.tckGrepInvert // ""' "${lock}")" all "$(jq -r '.specs[].spec' "${lock}")"
            exit 0
          fi
          for name in $(jq -r '.components[] | select(.stack == "go-srv" and ((.tck.tags // []) | length) > 0) | .name' "${lock}"); do
            tags="$(jq -c --arg n "${name}" '.components[] | select(.name == $n) | .tck.tags' "${lock}")"
            # A backend's specs are the installed specs whose tags it all selects.
            specs=""
            for manifest in */spec.manifest.json; do
              if jq -e --argjson tags "${tags}" '.tckTags | all(. as $t | $tags | index($t) != null)' "${manifest}" > /dev/null; then
                specs="${specs} $(dirname "${manifest}")"
              fi
            done
            check_grep \
              "$(jq -r --arg n "${name}" '.components[] | select(.name == $n) | .tck.grep' "${lock}")" \
              "$(jq -r --arg n "${name}" '.components[] | select(.name == $n) | .tck.grepInvert // ""' "${lock}")" \
              "${name}" "${specs}"
          done
      - name: Collect logs
        if: always()
        run: |
          docker compose -f "${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml" --profile app logs --no-color > "${RUNNER_TEMP}/compose.log" 2>&1 || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-${{ matrix.selection }}
          path: |
            ${{ runner.temp }}/gen-a/specs/test-results/
            ${{ runner.temp }}/gen-a/specs/playwright-report/
            initializer-e2e/playwright-report/
            initializer-e2e/test-results/
            ${{ runner.temp }}/compose.log
            ${{ runner.temp }}/tck-list-*.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml" ]; then
            docker compose -f "${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml" --profile app down -v
          fi

  generated-project-host-dev:
    name: generated-project-host-dev
    needs: [generator]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      TCK_BASE_URL: http://localhost:10120
      APP_PUBLIC_BASE_URL: http://localhost:10120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-srv/go.mod
          cache-dependency-path: go-srv/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: specs/package.json
          cache: npm
          cache-dependency-path: initializer-e2e/package-lock.json
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install: false
          cache: false
          working_directory: ${{ runner.temp }}
      - name: Build the CLI and generate the project
        run: |
          set -euo pipefail
          go -C tooling/generator build -o "${RUNNER_TEMP}/initializer" ./cmd/initializer
          git ls-files -z > "${RUNNER_TEMP}/files.bin"
          "${RUNNER_TEMP}/initializer" catalog build \
            --root "${GITHUB_WORKSPACE}" \
            --files "${RUNNER_TEMP}/files.bin" \
            --out "${RUNNER_TEMP}/catalog.lock.json"
          "${RUNNER_TEMP}/initializer" generate \
            --root "${GITHUB_WORKSPACE}" \
            --catalog "${RUNNER_TEMP}/catalog.lock.json" \
            -f "${GITHUB_WORKSPACE}/tooling/generator/testdata/ci/api-keys+identity-web.json" \
            "${RUNNER_TEMP}/gen-a"
          "${RUNNER_TEMP}/initializer" verify "${RUNNER_TEMP}/gen-a"
      - name: Read the project layout from the lock
        id: layout
        run: |
          set -euo pipefail
          lock="${RUNNER_TEMP}/gen-a/initializer.lock.json"
          one() {
            jq -r --arg stack "$1" '[.components[] | select(.stack == $stack) | .name] | if length == 1 then .[0] else empty end' "${lock}"
          }
          srv="$(one go-srv)"
          web="$(one ng-web)"
          if [ -z "${srv}" ] || [ -z "${web}" ]; then
            echo "the lock names no single go-srv or ng-web component" >&2
            exit 1
          fi
          postgres="$(jq -r '.names["service.postgres"] // empty' "${lock}")"
          if [ -z "${postgres}" ]; then
            echo "the lock names no postgres service" >&2
            exit 1
          fi
          {
            echo "srv=${srv}"
            echo "web=${web}"
            echo "postgres=${postgres}"
          } >> "${GITHUB_OUTPUT}"
      - name: Install the project's tools with mise
        working-directory: ${{ runner.temp }}/gen-a
        run: |
          set -euo pipefail
          mise trust
          mise install
      - name: Start the infrastructure
        working-directory: ${{ runner.temp }}/gen-a
        env:
          POSTGRES: ${{ steps.layout.outputs.postgres }}
        run: |
          set -euo pipefail
          compose="docker compose -f ${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml"
          mise run infra
          for _ in $(seq 1 60); do
            state="$(${compose} ps --format json "${POSTGRES}" | jq -rs 'flatten | .[0].Health // empty')"
            if [ "${state}" = "healthy" ] && curl -fsS http://127.0.0.1:10133/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for the generated infrastructure" >&2
          exit 1
      - name: Prepare the TCK env and install the dependencies
        working-directory: ${{ runner.temp }}/gen-a
        env:
          WEB: ${{ steps.layout.outputs.web }}
        run: |
          set -euo pipefail
          # The lock's TCK env, as the backend reads it from its component folder.
          jq -r '.tckEnv | to_entries[]
            | .value as $v
            | (($v | test("/")) and ($v | test("://") | not) and ($v | startswith("/") | not)) as $rel
            | "\(.key)=\(if $rel then "../" + $v else $v end)"' \
            initializer.lock.json >> .deploy/local/.env
          mise exec -- npm --prefix "${WEB}" ci
          mise exec -- npm --prefix specs ci
      - name: Run the backend and the console on the host
        working-directory: ${{ runner.temp }}/gen-a
        run: |
          set -euo pipefail
          # setsid gives each task its own process group, so the kill stops go run and ng serve children.
          setsid mise run dev:srv > "${RUNNER_TEMP}/srv.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/srv.pid"
          setsid mise run dev:web > "${RUNNER_TEMP}/web.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/web.pid"
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:10100/health/ready > /dev/null && curl -fsS http://localhost:10120/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for the host-dev backend and console" >&2
          exit 1
      - name: Run the console e2e on the dev server
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/gen-a"
          mise exec -- npm --prefix initializer-e2e ci
          (cd initializer-e2e && mise exec -- npx playwright install --with-deps chromium)
          grep -Ev '^(PW_(VIDEO|SCREENSHOT|TRACE)|INIT_START_STACK|INIT_WEB_BASE_URL|INIT_USER_EMAIL|INIT_USER_PASSWORD)=' initializer-e2e/.example.env > initializer-e2e/.env
          email="$(. "${project}/.deploy/local/.example.env"; if [ -f "${project}/.deploy/local/.env" ]; then . "${project}/.deploy/local/.env"; fi; printf '%s' "${APP_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}")"
          password="$(. "${project}/.deploy/local/.example.env"; if [ -f "${project}/.deploy/local/.env" ]; then . "${project}/.deploy/local/.env"; fi; printf '%s' "${APP_BOOTSTRAP_ADMIN_PASSWORD:-change-me-local-only}")"
          printf 'INIT_WEB_BASE_URL=%s\nINIT_USER_EMAIL=%s\nINIT_USER_PASSWORD=%s\n' "${TCK_BASE_URL}" "${email}" "${password}" >> initializer-e2e/.env
          (cd initializer-e2e && mise exec -- npx playwright test tests/e2e/console --grep "@console-identity|@console-platform-keys")
      - name: Run the TCK with the mise task
        working-directory: ${{ runner.temp }}/gen-a
        run: |
          set -euo pipefail
          mise run tck
      - name: Stop the host processes, then prove the up and down tasks
        working-directory: ${{ runner.temp }}/gen-a
        run: |
          set -euo pipefail
          for name in srv web; do
            kill -- -"$(cat "${RUNNER_TEMP}/${name}.pid")" || true
          done
          for _ in $(seq 1 30); do
            if ! curl -fsS http://localhost:10100/health/ready > /dev/null 2>&1 && ! curl -fsS http://localhost:10120/ > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          mise run down
          mise run up
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:10120/health/ready > /dev/null; then
              mise run down
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for the project started by mise run up" >&2
          exit 1
      - name: Collect logs
        if: always()
        run: |
          docker compose -f "${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml" --profile app logs --no-color > "${RUNNER_TEMP}/compose.log" 2>&1 || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-host-dev
          path: |
            ${{ runner.temp }}/gen-a/specs/test-results/
            ${{ runner.temp }}/gen-a/specs/playwright-report/
            initializer-e2e/playwright-report/
            initializer-e2e/test-results/
            ${{ runner.temp }}/srv.log
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/compose.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop the processes and the stack
        if: always()
        run: |
          for name in srv web; do
            if [ -f "${RUNNER_TEMP}/${name}.pid" ]; then
              kill -- -"$(cat "${RUNNER_TEMP}/${name}.pid")" 2>/dev/null || true
            fi
          done
          if [ -f "${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml" ]; then
            docker compose -f "${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml" --profile app down -v
          fi

  generated-projects:
    name: generated-projects
    needs: [selections, generated-project, generated-project-host-dev]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every generated-project leg passed
        run: |
          test "${{ needs.selections.result }}" = success
          test "${{ needs.generated-project.result }}" = success
          test "${{ needs.generated-project-host-dev.result }}" = success

  tck:
    name: tck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      APP_PUBLIC_BASE_URL: http://localhost:10100
      TCK_BASE_URL: http://localhost:10100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-srv/go.mod
          cache-dependency-path: go-srv/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: specs/package.json
          cache: npm
          cache-dependency-path: specs/package-lock.json
      - name: Install and check the TCK runner
        working-directory: specs
        run: |
          npm ci
          npm run typecheck
          npm run check:tags
          npm run test:scripts
      - name: Prepare the local stack env
        run: cp .deploy/local/.example.env .deploy/local/.env
      - name: Start the local stack
        run: |
          set -euo pipefail
          compose="docker compose -f .deploy/local/docker-compose.yml"
          ${compose} up -d
          for _ in $(seq 1 60); do
            state="$(${compose} ps --format json postgres | jq -rs 'flatten | .[0].Health // empty')"
            if [ "${state}" = "healthy" ] && curl -fsS http://localhost:10133/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for the local stack" >&2
          exit 1
      - name: Build and start go-srv
        run: |
          set -euo pipefail
          go -C go-srv build -o "${RUNNER_TEMP}/go-srv" ./cmd/server
          set -a; . .deploy/local/.env; set +a
          export APP_PUBLIC_BASE_URL=http://localhost:10100
          eval "$(node specs/scripts/tck-env.mjs)"
          "${RUNNER_TEMP}/go-srv" > "${RUNNER_TEMP}/go-srv.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/go-srv.pid"
          url=http://localhost:10100/health/ready
          for _ in $(seq 1 60); do
            if curl -fsS "${url}" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for ${url}" >&2
          exit 1
      - name: Run the TCK
        working-directory: specs
        run: npm run tck
      - name: Collect logs
        if: always()
        run: |
          docker compose -f .deploy/local/docker-compose.yml logs --no-color > "${RUNNER_TEMP}/compose.log" 2>&1 || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tck-${{ github.run_id }}
          path: |
            specs/test-results/
            ${{ runner.temp }}/go-srv.log
            ${{ runner.temp }}/compose.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop go-srv and the stack
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/go-srv.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/go-srv.pid")" || true
          fi
          docker compose -f .deploy/local/docker-compose.yml down -v

  node-ng-web:
    name: node (ng-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ng-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ng-web/package.json
          cache: npm
          cache-dependency-path: ng-web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --watch=false


  node-initializer-e2e:
    name: node (initializer-e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: initializer-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: initializer-e2e/package.json
          cache: npm
          cache-dependency-path: initializer-e2e/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: CI artifact capture guard
        run: npx playwright test tests/smoke/ci-artifact-capture.spec.ts

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      INIT_START_STACK: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-srv/go.mod
          cache-dependency-path: go-srv/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: initializer-e2e/package.json
          cache: npm
          cache-dependency-path: |
            ng-web/package-lock.json
            initializer-e2e/package-lock.json
      - name: Install ng-web and the e2e suite
        run: |
          set -euo pipefail
          npm --prefix ng-web ci
          npm --prefix initializer-e2e ci
          (cd initializer-e2e && npx playwright install --with-deps chromium)
      - name: Prepare the env files
        run: |
          set -euo pipefail
          cp .deploy/local/.example.env .deploy/local/.env
          grep -Ev '^PW_(VIDEO|SCREENSHOT|TRACE)=' initializer-e2e/.example.env > initializer-e2e/.env
      - name: Start the local stack
        run: |
          set -euo pipefail
          compose="docker compose -f .deploy/local/docker-compose.yml"
          ${compose} up -d
          for _ in $(seq 1 60); do
            state="$(${compose} ps --format json postgres | jq -rs 'flatten | .[0].Health // empty')"
            if [ "${state}" = "healthy" ] && curl -fsS http://localhost:10133/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for the local stack" >&2
          exit 1
      - name: Create the e2e database
        run: |
          set -euo pipefail
          docker compose -f .deploy/local/docker-compose.yml exec -T postgres psql -U initializer -d postgres -c 'CREATE DATABASE it_e2e_platform'
      - name: Run the platform e2e
        working-directory: initializer-e2e
        run: npx playwright test tests/e2e/platform
      - name: Collect logs
        if: always()
        run: |
          docker compose -f .deploy/local/docker-compose.yml logs --no-color > "${RUNNER_TEMP}/compose.log" 2>&1 || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ github.run_id }}
          path: |
            initializer-e2e/playwright-report/
            initializer-e2e/test-results/
            ${{ runner.temp }}/compose.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose -f .deploy/local/docker-compose.yml down -v
