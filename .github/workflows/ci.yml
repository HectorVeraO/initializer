name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of oasdiff_1.34.1_linux_amd64.tar.gz: 75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90
  OASDIFF_VERSION: 1.34.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          curl -sSfL -o "${RUNNER_TEMP}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "${RUNNER_TEMP}"
          grep " ${archive}\$" checksums.txt | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "${GITHUB_PATH}"
      - name: Scan full history
        run: gitleaks git --redact --verbose --exit-code 1 .

  go-go-srv:
    name: go (go-srv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-srv
    env:
      GATBASE_TEST_DATABASE_URL: postgres://initializer@localhost:10132/initializer?sslmode=disable
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: initializer
          POSTGRES_USER: initializer
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["10132:5432"]
        options: >-
          --health-cmd "pg_isready -U initializer -d initializer"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-srv/go.mod
          cache-dependency-path: go-srv/go.mod
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # -race needs cgo and a C compiler, which ubuntu-latest has and the local Windows setup lacks.
      - name: Test
        run: go test -race ./...

  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/gates/go.mod
          cache-dependency-path: tooling/gates/go.sum
      - name: Install oasdiff
        run: |
          set -euo pipefail
          base="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "${base}/${archive}"
          curl -sSfL -o "${RUNNER_TEMP}/checksums.txt" "${base}/checksums.txt"
          cd "${RUNNER_TEMP}"
          grep " ${archive}\$" checksums.txt | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/oasdiff-bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/oasdiff-bin" oasdiff
          echo "${RUNNER_TEMP}/oasdiff-bin" >> "${GITHUB_PATH}"
      - name: Format
        working-directory: tooling/gates
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}"
            exit 1
          fi
      - name: Vet
        run: go -C tooling/gates vet ./...
      - name: Test
        run: go -C tooling/gates test ./...
      - name: Check flags.yaml, migrations, contracts and versions
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="origin/main"
          if [ -n "${PR_BASE_SHA}" ]; then
            base="${PR_BASE_SHA}"
          elif [ -n "${PUSH_BEFORE_SHA}" ] && [ -n "${PUSH_BEFORE_SHA//0/}" ]; then
            base="${PUSH_BEFORE_SHA}"
          fi
          go -C tooling/gates run ./cmd/gates flags --root "${GITHUB_WORKSPACE}" --base-rev "${base}"
          go -C tooling/gates run ./cmd/gates migrations --root "${GITHUB_WORKSPACE}" --base-rev "${base}"
          go -C tooling/gates run ./cmd/gates contracts --root "${GITHUB_WORKSPACE}" --base-rev "${base}"
          go -C tooling/gates run ./cmd/gates versions --root "${GITHUB_WORKSPACE}" --base-rev "${base}"

  generator:
    name: generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tooling/generator/go.mod
      - name: Format
        working-directory: tooling/generator
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}"
            exit 1
          fi
      - name: Vet
        run: go -C tooling/generator vet ./...
      - name: Test
        run: go -C tooling/generator test ./...
      - name: Build the catalog twice and compare
        run: |
          set -euo pipefail
          git ls-files -z > "${RUNNER_TEMP}/files.bin"
          for out in catalog.lock.json catalog-2.lock.json; do
            go -C tooling/generator run ./cmd/initializer catalog build               --root "${GITHUB_WORKSPACE}"               --files "${RUNNER_TEMP}/files.bin"               --out "${RUNNER_TEMP}/${out}"
          done
          cmp "${RUNNER_TEMP}/catalog.lock.json" "${RUNNER_TEMP}/catalog-2.lock.json"
      - name: Reference round-trip
        run: |
          set -euo pipefail
          ref="${RUNNER_TEMP}/ref"
          go -C tooling/generator run ./cmd/initializer generate \
            --root "${GITHUB_WORKSPACE}" \
            --catalog "${RUNNER_TEMP}/catalog.lock.json" \
            --out "${ref}" \
            --all-modules --stacks go-srv --name initializer \
            --go-module "$(head -1 go-srv/go.mod | cut -d' ' -f2)"
          # Rendered files and target-delivered files differ from the repository by design.
          status=0
          while IFS= read -r file; do
            path="${file#"${ref}/"}"
            case "${path}" in
              README.md|gatbase.selection.json|gatbase.lock.json|flags.yaml) continue ;;
            esac
            if ! cmp -s "${file}" "${GITHUB_WORKSPACE}/${path}"; then
              echo "round-trip difference: ${path}" >&2
              status=1
            fi
          done < <(find "${ref}" -type f | sort)
          exit "${status}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-lock
          path: ${{ runner.temp }}/catalog.lock.json
          retention-days: 7

  generated-project:
    name: generated-project (${{ matrix.selection }})
    needs: generator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        selection: [core-parameters, all]
    env:
      CI: "true"
      GATBASE_PUBLIC_BASE_URL: http://localhost:10100
      TCK_BASE_URL: http://localhost:10100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-srv/go.mod
          cache-dependency-path: go-srv/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: specs/package.json
          cache: npm
          cache-dependency-path: specs/package-lock.json
      - name: Build the CLI and the catalog
        run: |
          set -euo pipefail
          go -C tooling/generator build -o "${RUNNER_TEMP}/initializer" ./cmd/initializer
          git ls-files -z > "${RUNNER_TEMP}/files.bin"
          "${RUNNER_TEMP}/initializer" catalog build \
            --root "${GITHUB_WORKSPACE}" \
            --files "${RUNNER_TEMP}/files.bin" \
            --out "${RUNNER_TEMP}/catalog.lock.json"
      - name: Generate twice, compare and verify
        run: |
          set -euo pipefail
          for name in gen-a gen-b; do
            "${RUNNER_TEMP}/initializer" generate \
              --root "${GITHUB_WORKSPACE}" \
              --catalog "${RUNNER_TEMP}/catalog.lock.json" \
              --selection "${GITHUB_WORKSPACE}/tooling/generator/testdata/ci/${{ matrix.selection }}.json" \
              --out "${RUNNER_TEMP}/${name}"
          done
          diff -r "${RUNNER_TEMP}/gen-a" "${RUNNER_TEMP}/gen-b"
          "${RUNNER_TEMP}/initializer" verify --project "${RUNNER_TEMP}/gen-a"
      - name: The source module path is gone
        run: |
          set -euo pipefail
          source_module="$(head -1 go-srv/go.mod | cut -d' ' -f2)"
          if grep -rF "${source_module}" "${RUNNER_TEMP}/gen-a"; then
            echo "the source module path leaked into the generated project" >&2
            exit 1
          fi
      - name: Start the generated project stack
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/gen-a"
          cp "${project}/.deploy/local/.example.env" "${project}/.deploy/local/.env"
          compose="docker compose -f ${project}/.deploy/local/docker-compose.yml"
          ${compose} up -d
          for _ in $(seq 1 60); do
            state="$(${compose} ps --format json postgres | jq -rs 'flatten | .[0].Health // empty')"
            if [ "${state}" = "healthy" ] && curl -fsS http://127.0.0.1:10133/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for the generated project stack" >&2
          exit 1
      - name: Format, vet, build and test the generated go-srv
        working-directory: ${{ runner.temp }}/gen-a/go-srv
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "${unformatted}" >&2
            exit 1
          fi
          go vet ./...
          go build ./...
          database_url="$(. ../.deploy/local/.env; printf '%s' "${GATBASE_DATABASE_URL}")"
          GATBASE_TEST_DATABASE_URL="${database_url}" go test ./...
      - name: Build and start the generated go-srv
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/gen-a"
          go -C "${project}/go-srv" build -o "${RUNNER_TEMP}/go-srv-bin" ./cmd/server
          cd "${project}"
          set -a; . .deploy/local/.env; set +a
          while IFS= read -r pair; do
            export "${pair}"
          done < <(jq -r '.tckEnv | to_entries[] | "\(.key)=\(.value)"' gatbase.lock.json)
          export GATBASE_PUBLIC_BASE_URL=http://localhost:10100
          "${RUNNER_TEMP}/go-srv-bin" > "${RUNNER_TEMP}/go-srv.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/go-srv.pid"
          url=http://localhost:10100/health/ready
          for _ in $(seq 1 60); do
            if curl -fsS "${url}" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for ${url}" >&2
          exit 1
      - name: Run the TCK the lock selects
        working-directory: ${{ runner.temp }}/gen-a/specs
        run: |
          set -euo pipefail
          npm ci
          locked="$(jq -r '.tckTags | join(",")' ../gatbase.lock.json)"
          installed="$(jq -rs '[.[].tckTags[]] | unique | join(",")' */spec.manifest.json)"
          if [ "${locked}" != "${installed}" ]; then
            echo "installed tags ${installed} differ from the lock ${locked}" >&2
            exit 1
          fi
          npm run tck
      - name: Check the specs the lock selects
        working-directory: ${{ runner.temp }}/gen-a/specs
        run: |
          set -euo pipefail
          # The two TCK passes write one junit file, so the selected tests are counted from the lock's grep.
          npx playwright test --list --reporter=list --grep "$(jq -r .tckGrep ../gatbase.lock.json)" > "${RUNNER_TEMP}/tck-list.txt"
          for spec in core core-auth parameters; do
            count="$(grep -c " ${spec}/tck/" "${RUNNER_TEMP}/tck-list.txt" || true)"
            echo "${spec}: ${count} tests"
            test "${count}" -gt 0
          done
          flags="$(grep -c " feature-flags/tck/" "${RUNNER_TEMP}/tck-list.txt" || true)"
          if [ "${{ matrix.selection }}" = "all" ]; then
            test "${flags}" -gt 0
          else
            test "${flags}" -eq 0
          fi
      - name: Collect logs
        if: always()
        run: |
          docker compose -f "${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml" logs --no-color > "${RUNNER_TEMP}/compose.log" 2>&1 || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-${{ matrix.selection }}
          path: |
            ${{ runner.temp }}/gen-a/specs/test-results/
            ${{ runner.temp }}/gen-a/specs/playwright-report/
            ${{ runner.temp }}/go-srv.log
            ${{ runner.temp }}/compose.log
            ${{ runner.temp }}/tck-list.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Stop go-srv and the stack
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/go-srv.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/go-srv.pid")" || true
          fi
          if [ -f "${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml" ]; then
            docker compose -f "${RUNNER_TEMP}/gen-a/.deploy/local/docker-compose.yml" down -v
          fi

  tck:
    name: tck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      GATBASE_PUBLIC_BASE_URL: http://localhost:10100
      TCK_BASE_URL: http://localhost:10100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-srv/go.mod
          cache-dependency-path: go-srv/go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: specs/package.json
          cache: npm
          cache-dependency-path: specs/package-lock.json
      - name: Install and check the TCK runner
        working-directory: specs
        run: |
          npm ci
          npm run typecheck
          npm run check:tags
          npm run test:scripts
      - name: Prepare the local stack env
        run: cp .deploy/local/.example.env .deploy/local/.env
      - name: Start the local stack
        run: |
          set -euo pipefail
          compose="docker compose -f .deploy/local/docker-compose.yml"
          ${compose} up -d
          for _ in $(seq 1 60); do
            state="$(${compose} ps --format json postgres | jq -rs 'flatten | .[0].Health // empty')"
            if [ "${state}" = "healthy" ] && curl -fsS http://localhost:10133/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for the local stack" >&2
          exit 1
      - name: Build and start go-srv
        run: |
          set -euo pipefail
          go -C go-srv build -o "${RUNNER_TEMP}/go-srv" ./cmd/server
          set -a; . .deploy/local/.env; set +a
          export GATBASE_PUBLIC_BASE_URL=http://localhost:10100
          eval "$(node specs/scripts/tck-env.mjs)"
          "${RUNNER_TEMP}/go-srv" > "${RUNNER_TEMP}/go-srv.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/go-srv.pid"
          url=http://localhost:10100/health/ready
          for _ in $(seq 1 60); do
            if curl -fsS "${url}" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for ${url}" >&2
          exit 1
      - name: Run the TCK
        working-directory: specs
        run: npm run tck
      - name: Collect logs
        if: always()
        run: |
          docker compose -f .deploy/local/docker-compose.yml logs --no-color > "${RUNNER_TEMP}/compose.log" 2>&1 || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tck-${{ github.run_id }}
          path: |
            specs/test-results/
            ${{ runner.temp }}/go-srv.log
            ${{ runner.temp }}/compose.log
          if-no-files-found: warn
          retention-days: 7
      - name: Stop go-srv and the stack
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/go-srv.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/go-srv.pid")" || true
          fi
          docker compose -f .deploy/local/docker-compose.yml down -v

  node-ng-web:
    name: node (ng-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ng-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ng-web/package.json
          cache: npm
          cache-dependency-path: ng-web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --watch=false


  node-initializer-e2e:
    name: node (initializer-e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: initializer-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: initializer-e2e/package.json
          cache: npm
          cache-dependency-path: initializer-e2e/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
