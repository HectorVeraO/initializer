<div class="layout-topbar" data-testid="shell-topbar-restyled">
  <div class="layout-topbar-logo-container">
    <a class="layout-topbar-logo" routerLink="/">
      @if (logoUrl) {
      <img data-testid="topbar-logo" [src]="logoUrl" [alt]="brand" class="h-7 w-auto" />
      } @else {
      <span data-testid="topbar-logo">{{ brand }}</span>
      }
    </a>
    <button pButton type="button" severity="secondary" [text]="true" rounded class="layout-menu-button" [attr.aria-label]="'topbar.menu' | transloco" data-testid="menu-toggle" (click)="layoutService.onMenuToggle()">
      <i class="pi pi-bars"></i>
    </button>
  </div>

  <div class="layout-topbar-actions">
    @for (item of contextItems; track item.id) {
    <span [attr.data-testid]="'topbar-' + item.id"><ng-container *ngComponentOutlet="item.component" /></span>
    }
    <p-select data-testid="language-select" [options]="languages" [ngModel]="selectedLang()" (onChange)="setLang($event.value.code)" dataKey="code" appendTo="body" [style]="{ minWidth: '7rem' }">
      <ng-template #selectedItem let-lang>
        <span class="text-sm font-medium">{{ 'topbar.lang.' + lang.code | transloco }}</span>
      </ng-template>
      <ng-template #item let-lang>
        <span>{{ 'topbar.lang.' + lang.code | transloco }}</span>
      </ng-template>
    </p-select>
    <button pButton type="button" severity="secondary" [text]="true" rounded [attr.aria-label]="'topbar.theme' | transloco" data-testid="theme-toggle" (click)="toggleDarkMode()">
      <i [class]="layoutService.isDarkTheme() ? 'pi pi-moon' : 'pi pi-sun'"></i>
    </button>
    @for (item of accountItems; track item.id) {
    <span [attr.data-testid]="'topbar-' + item.id"><ng-container *ngComponentOutlet="item.component" /></span>
    }
  </div>
</div>
