<p-dialog
  [visible]="secret() !== null"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [closable]="false"
  [dismissableMask]="false"
  [header]="titleKey() | transloco"
  [style]="{ width: '34rem', maxWidth: '95vw' }"
  data-testid="one-time-secret-dialog"
>
  <div class="flex flex-col gap-3">
    <p class="m-0 text-sm">{{ 'core.secret.once' | transloco }}</p>
    <input pInputText readonly class="w-full" [value]="secret() ?? ''" [attr.aria-label]="titleKey() | transloco" data-testid="one-time-secret-value" />
  </div>
  <ng-template #footer>
    <button pButton type="button" severity="secondary" [outlined]="true" data-testid="one-time-secret-copy" (click)="copy()">{{ 'core.secret.copy' | transloco }}</button>
    <button pButton type="button" data-testid="one-time-secret-close" (click)="close()">{{ 'core.secret.close' | transloco }}</button>
  </ng-template>
</p-dialog>
