<p-dialog
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  [modal]="true"
  [header]="(isEdit() ? 'parameters.definition.editTitle' : 'parameters.definition.createTitle') | transloco"
  [style]="{ width: '40rem', maxWidth: '95vw' }"
  data-testid="parameter-definition-dialog"
>
  <div class="flex flex-col gap-4" [formGroup]="form">
    <p-form-field [label]="'parameters.definition.key' | transloco" controlId="parameter-def-key-input" [errors]="keyMessages()" errorTestId="parameter-def-key-error">
      <input pInputText id="parameter-def-key-input" type="text" autocomplete="off" [readOnly]="isEdit()" formControlName="key" data-testid="parameter-def-key" />
    </p-form-field>

    <p-form-field [label]="'parameters.definition.valueType' | transloco" controlId="parameter-def-type-input" [errors]="typeMessages()" errorTestId="parameter-def-type-error">
      <p-select inputId="parameter-def-type-input" [options]="valueTypes" formControlName="valueType" appendTo="body" data-testid="parameter-def-type">
        <ng-template #selectedItem let-option>{{ 'parameters.types.' + option | transloco }}</ng-template>
        <ng-template #item let-option>
          <span data-testid="parameter-def-type-option" [attr.data-key]="option">{{ 'parameters.types.' + option | transloco }}</span>
        </ng-template>
      </p-select>
    </p-form-field>

    <p-form-field [label]="'parameters.definition.defaultValue' | transloco" controlId="parameter-def-default-input" [errors]="defaultMessages()" errorTestId="parameter-def-default-error">
      @if (valueType() === 'boolean') {
        <p-toggleswitch inputId="parameter-def-default-input" formControlName="defaultBoolean" data-testid="parameter-def-default" />
      } @else {
        <input pInputText id="parameter-def-default-input" type="text" autocomplete="off" formControlName="defaultText" data-testid="parameter-def-default" />
      }
    </p-form-field>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <p-form-field [label]="'parameters.definition.minValue' | transloco" controlId="parameter-def-min-input" [errors]="minMessages()" errorTestId="parameter-def-min-error">
        <input pInputText id="parameter-def-min-input" type="number" step="any" formControlName="min" data-testid="parameter-def-min" />
      </p-form-field>
      <p-form-field [label]="'parameters.definition.maxValue' | transloco" controlId="parameter-def-max-input" [errors]="maxMessages()" errorTestId="parameter-def-max-error">
        <input pInputText id="parameter-def-max-input" type="number" step="any" formControlName="max" data-testid="parameter-def-max" />
      </p-form-field>
    </div>

    <p-form-field [label]="'parameters.definition.allowedValues' | transloco" controlId="parameter-def-allowed-input" [errors]="allowedMessages()" errorTestId="parameter-def-allowed-error">
      <input pInputText id="parameter-def-allowed-input" type="text" autocomplete="off" formControlName="allowedText" data-testid="parameter-def-allowed" />
    </p-form-field>

    <p-form-field [label]="'parameters.definition.description' | transloco" controlId="parameter-def-description-input" [errors]="descriptionMessages()" errorTestId="parameter-def-description-error">
      <input pInputText id="parameter-def-description-input" type="text" autocomplete="off" formControlName="description" data-testid="parameter-def-description" />
    </p-form-field>

    <p-form-field [label]="'parameters.definition.isSystemRequired' | transloco" controlId="parameter-def-system-input" [errors]="systemMessages()" errorTestId="parameter-def-system-error">
      <p-toggleswitch inputId="parameter-def-system-input" formControlName="isSystemRequired" data-testid="parameter-def-system" />
    </p-form-field>

    @if (formMessages().length > 0) {
      <div role="alert" data-testid="parameter-def-issues">
        <p-message severity="error">
          @for (message of formMessages(); track $index) {
            <div>{{ message }}</div>
          }
        </p-message>
      </div>
    }
  </div>
  <ng-template #footer>
    <button pButton type="button" severity="secondary" [outlined]="true" data-testid="parameter-def-cancel" (click)="close()">{{ 'parameters.definition.cancel' | transloco }}</button>
    <button pButton type="button" data-testid="parameter-def-save" [disabled]="isSubmitting()" (click)="save()">{{ 'parameters.definition.save' | transloco }}</button>
  </ng-template>
</p-dialog>
