<div class="card flex flex-col gap-4" data-testid="no-tenant">
  <h1 class="text-2xl font-semibold m-0">{{ 'tenancy.noTenant.title' | transloco }}</h1>
  <p class="m-0">{{ 'tenancy.noTenant.message' | transloco }}</p>
  @if (account(); as current) {
    <p class="m-0 text-sm">
      {{ 'tenancy.noTenant.account' | transloco }} <span data-testid="no-tenant-account-email">{{ current.email }}</span>
    </p>
  }
  @if (allowedEntries().length > 0) {
    <div class="flex flex-col gap-2">
      @for (entry of allowedEntries(); track entry.id) {
        <a [routerLink]="entry.path" class="text-primary" [attr.data-testid]="'no-tenant-nav-' + entry.id">{{ entry.label }}</a>
      }
    </div>
  }
  <div>
    <button pButton type="button" severity="secondary" data-testid="sign-out" (click)="signOut()">{{ 'tenancy.noTenant.signOut' | transloco }}</button>
  </div>
</div>
