<div class="flex min-h-screen items-center justify-center bg-surface-50 p-6 dark:bg-surface-950">
  <div class="flex w-full max-w-md flex-col items-center gap-4 rounded-xl border border-surface bg-surface-0 p-10 text-center dark:bg-surface-900">
    <span class="text-lg font-medium text-color">{{ brand }}</span>
    <span class="text-display-lg font-medium text-primary">404</span>
    <h1 class="m-0 text-display-xs font-medium text-color">{{ 'common.notFound' | transloco }}</h1>
    <p class="m-0 text-md text-muted-color">{{ 'common.notFoundMessage' | transloco }}</p>
    <p-button [label]="'common.goToDashboard' | transloco" routerLink="/" />
  </div>
</div>
