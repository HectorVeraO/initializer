openapi: 3.1.0
info:
  title: Identity
  version: 2.0.0
  description: >
    Identity (Ory Kratos behind a stateless BFF session), flat tenancy, invitations,
    memberships and M2M API keys. Every /api/v1 body is ApiEnvelope<T>. Session cookie
    name and token format are not pinned (see x-initializer-tck). The CSRF cookie XSRF-TOKEN
    and header X-XSRF-TOKEN are pinned.
servers:
  - url: /
security: []
tags:
  - name: session
  - name: tenants
  - name: memberships
  - name: invitations
  - name: api-keys
x-initializer-tck:
  pinned:
    - routes, methods, bodies, status codes and error codes of this file
    - CSRF cookie XSRF-TOKEN readable by JS and header X-XSRF-TOKEN on cookie-borne mutations
    - CheckAccess order (ACCOUNT_LOCKED_OR_DISABLED, TENANT_ACCESS_DENIED, TENANT_SUSPENDED, MEMBERSHIP_REVOKED)
  unpinned:
    - session cookie name, number of session cookies, token format and claims
    - identity provider endpoints
    - how refresh is implemented
paths:
  /api/v1/auth/session:
    get:
      operationId: getSession
      tags: [session]
      description: >
        Returns the session. Without a valid BFF session it issues one from the identity
        provider session; a tenantless session is moved onto a usable tenant when one exists.
      security: [{}, { sessionCookie: [] }]
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [session]
      description: Re-runs the status checks and re-issues the session on the same tenant. Accepts an expired session.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/switch-tenant:
    post:
      operationId: switchTenant
      tags: [session]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SwitchTenantRequest' }
      responses:
        '200': { $ref: '#/components/responses/SessionOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [session]
      description: Revokes the identity provider session and clears every session cookie. Needs a session whose signature verifies (expired allowed up to the refresh maximum age); an absent or unusable session answers 401 and clears nothing.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
      responses:
        '200': { $ref: '#/components/responses/LogoutOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/tenant:
    get:
      operationId: getCurrentTenant
      tags: [tenants]
      security: [{ sessionCookie: [] }, { apiKey: [] }]
      x-initializer-scope: tenant:read
      parameters:
        - name: tenantId
          in: query
          required: false
          description: Tenant UUID or slug, case-insensitive; must name the caller's tenant.
          schema: { type: string, maxLength: 64 }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      responses:
        '200': { $ref: '#/components/responses/TenantSummaryOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      description: Platform operator only. Cross-tenant by design.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/TenantStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [createdAt, -createdAt, slug, -slug], default: slug }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      responses:
        '200': { $ref: '#/components/responses/TenantPageOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTenant
      tags: [tenants]
      description: Platform operator only. Creates the tenant and a one-time admin invitation for adminEmail.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantRequest' }
      responses:
        '201': { $ref: '#/components/responses/TenantCreatedOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/tenants/{id}/status:
    patch:
      operationId: setTenantStatus
      tags: [tenants]
      description: Platform operator only. Suspension blocks the tenant's API keys on their next request.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetTenantStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/TenantViewOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/memberships:
    get:
      operationId: listMemberships
      tags: [memberships]
      description: Members of the active tenant. Without status, returns active and suspended.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/MembershipStatus' } }
        - { name: role, in: query, required: false, schema: { $ref: '#/components/schemas/Role' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [createdAt, -createdAt, email, -email], default: email }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      responses:
        '200': { $ref: '#/components/responses/MemberPageOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/memberships/{id}:
    patch:
      operationId: updateMembership
      tags: [memberships]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMembershipRequest' }
      responses:
        '200': { $ref: '#/components/responses/MemberViewOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/invitations:
    get:
      operationId: listInvitations
      tags: [invitations]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/InvitationStatus' }
          description: Defaults to pending.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [createdAt, -createdAt], default: -createdAt }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      responses:
        '200': { $ref: '#/components/responses/InvitationPageOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createInvitation
      tags: [invitations]
      description: Admin only. Inviting an address on the platform operator list needs a platform operator, else 403 PLATFORM_OPERATOR_REQUIRED.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201': { $ref: '#/components/responses/InvitationCreatedOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/invitations/{id}:
    delete:
      operationId: revokeInvitation
      tags: [invitations]
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      responses:
        '200': { $ref: '#/components/responses/InvitationViewOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      description: Signed-in account accepts; the account email must match the invitation email, case-insensitive.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitationRequest' }
      responses:
        '200': { $ref: '#/components/responses/AcceptOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/invitations/accept-new:
    post:
      operationId: acceptInvitationAsNewAccount
      tags: [invitations]
      description: >
        Unauthenticated. Creates the identity with the invited email and the given password,
        then the account and the membership. The caller then signs in.
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptNewInvitationRequest' }
      responses:
        '201': { $ref: '#/components/responses/AcceptNewOk' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/api-keys:
    get:
      operationId: listApiKeys
      tags: [api-keys]
      description: Admin session, or an API key holding api-keys:read. Never a secret or hash.
      security: [{ sessionCookie: [] }, { apiKey: [] }]
      x-initializer-scope: api-keys:read
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ApiKeyStatus' }
          description: Every status when absent.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [createdAt, -createdAt, name, -name], default: -createdAt }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      responses:
        '200': { $ref: '#/components/responses/ApiKeyPageOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      operationId: createApiKey
      tags: [api-keys]
      description: Admin session only. plainTextKey is shown once and never stored.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiKeyRequest' }
      responses:
        '201': { $ref: '#/components/responses/ApiKeyCreatedOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      tags: [api-keys]
      description: Admin session only. Idempotent; a foreign, unknown or malformed id is 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/XsrfToken' }
        - { $ref: '#/components/parameters/ActiveTenantId' }
      responses:
        '200': { $ref: '#/components/responses/ApiKeyViewOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/api-key-scopes:
    get:
      operationId: listApiKeyScopes
      tags: [api-keys]
      description: Admin session only. The scopes registered by installed modules, ordered by name.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/ActiveTenantId' }
      responses:
        '200': { $ref: '#/components/responses/ScopeListOk' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: app_session
      description: Name is __Host-app_session over https. Not pinned by the TCK; treat it as opaque.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Format ^gbk_live_[a-z2-7]{16}_[a-z2-7]{52}$. Never combined with a session cookie (409 CREDENTIAL_CONFLICT)."
  parameters:
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: Required on cookie-authenticated mutations; value of the XSRF-TOKEN cookie. Missing or wrong -> 403 CSRF_TOKEN_INVALID.
      schema: { type: string }
    ActiveTenantId:
      name: X-Active-Tenant-Id
      in: header
      required: false
      description: Tenant the client rendered. Differs from the session tenant -> 409 ACTIVE_TENANT_CHANGED, nothing executed. Ignored for API keys.
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      description: UUID. A malformed, unknown or other tenant's id answers the same 404 RESOURCE_NOT_FOUND.
      schema: { type: string }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  headers:
    XTraceId:
      description: The trace id of the request; equals meta.traceId of the body.
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    CacheControl:
      schema: { type: string, const: no-store }
  responses:
    Error:
      description: Error envelope.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelopeError'
    SessionOk:
      description: Session view.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SessionView' } } } ] }
    LogoutOk:
      description: Cookies cleared.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
        Cache-Control: { $ref: '#/components/headers/CacheControl' }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/LogoutResult' } } } ] }
    TenantSummaryOk:
      description: Caller's tenant.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/TenantSummary' } } } ] }
    TenantViewOk:
      description: Tenant.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/TenantView' } } } ] }
    TenantPageOk:
      description: Page of tenants.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/PageInfo' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/TenantView' } } } } ] } } } ] }
    TenantCreatedOk:
      description: Tenant and its admin invitation; invitationUrl is shown once.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/TenantCreated' } } } ] }
    MemberViewOk:
      description: Member.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/MemberView' } } } ] }
    MemberPageOk:
      description: Page of members.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/PageInfo' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MemberView' } } } } ] } } } ] }
    InvitationViewOk:
      description: Invitation.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/InvitationView' } } } ] }
    InvitationPageOk:
      description: Page of invitations; never a token or URL.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/PageInfo' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/InvitationView' } } } } ] } } } ] }
    InvitationCreatedOk:
      description: invitationUrl is shown once and never stored.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/InvitationCreated' } } } ] }
    AcceptOk:
      description: Membership active.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AcceptResult' } } } ] }
    AcceptNewOk:
      description: Identity, account and membership created.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/AcceptNewResult' } } } ] }
    ApiKeyViewOk:
      description: API key metadata.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/ApiKeyView' } } } ] }
    ApiKeyPageOk:
      description: Page of API key metadata; never a secret, hash or plain key.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/PageInfo' }, { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ApiKeyView' } } } } ] } } } ] }
    ApiKeyCreatedOk:
      description: plainTextKey is shown once and never stored.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/ApiKeyCreated' } } } ] }
    ScopeListOk:
      description: Registered scopes ordered by name.
      headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' }, Cache-Control: { $ref: '#/components/headers/CacheControl' } }
      content:
        application/json:
          schema: { allOf: [ { $ref: '#/components/schemas/SuccessEnvelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ScopeInfo' } } } } ] }
  schemas:
    ApiMeta:
      type: object
      required: [traceId, timestamp]
      additionalProperties: false
      properties:
        traceId:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: 32 lowercase hex characters, never all zeros.
        timestamp:
          type: string
          format: date-time
          description: RFC 3339 UTC in whole seconds, ending in Z.
    ApiIssue:
      type: object
      required: [field, code, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: JSON path into the request body or a query parameter name; empty means the whole body.
        code:
          $ref: '#/components/schemas/ApiIssueCode'
        message:
          type: string
    ApiError:
      type: object
      required: [code, message, issues]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ApiIssue'
    ApiEnvelopeError:
      type: object
      required: [data, meta, error]
      additionalProperties: false
      properties:
        data:
          type: 'null'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        error:
          $ref: '#/components/schemas/ApiError'
    ApiErrorCode:
      type: string
      description: Top-level error.code. The set grows (x-extensible-enum), so a client treats an unknown code as a generic error; renaming or removing a code is a breaking change.
      x-extensible-enum:
        - SESSION_INVALID
        - CSRF_TOKEN_INVALID
        - ACCOUNT_LOCKED_OR_DISABLED
        - TENANT_ACCESS_DENIED
        - TENANT_SUSPENDED
        - MEMBERSHIP_REVOKED
        - ACTIVE_TENANT_CHANGED
        - VALIDATION_FAILED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - ROUTE_NOT_FOUND
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - IDENTITY_PROVIDER_UNAVAILABLE
        - PLATFORM_OPERATOR_REQUIRED
        - ACTIVE_TENANT_REQUIRED
        - INSUFFICIENT_ROLE
        - RESOURCE_NOT_FOUND
        - INVITATION_INVALID
        - INVITATION_EMAIL_MISMATCH
        - MEMBERSHIP_ALREADY_ACTIVE
        - INVITATION_NOT_PENDING
        - TENANT_SLUG_TAKEN
        - IDENTITY_ALREADY_EXISTS
        - TENANT_MISMATCH
        - LAST_TENANT_ADMIN
        - INVITATION_REQUIRED
        - API_KEY_INVALID_OR_REVOKED
        - INSUFFICIENT_SCOPE
        - CREDENTIAL_CONFLICT
    ApiIssueCode:
      type: string
      description: error.issues[].code, always under a 422 VALIDATION_FAILED. The set grows (x-extensible-enum), so a client treats an unknown code as a generic problem.
      x-extensible-enum:
        - BODY_MALFORMED
        - FIELD_REQUIRED
        - FIELD_TYPE_INVALID
        - FIELD_TOO_SHORT
        - FIELD_TOO_LONG
        - FIELD_OUT_OF_RANGE
        - FIELD_INVALID_FORMAT
        - FIELD_NOT_ALLOWED
        - FIELD_DUPLICATE
        - FIELD_MIN_ITEMS
        - PASSWORD_REJECTED
    SuccessEnvelope:
      type: object
      required: [data, meta, error]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/ApiMeta' }
        error: { type: 'null' }
    Role: { type: string, enum: [admin, member, viewer] }
    TenantStatus: { type: string, enum: [active, suspended] }
    MembershipStatus: { type: string, enum: [active, suspended, revoked] }
    TenantSummary:
      type: object
      required: [id, slug, name, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$' }
        name: { type: string }
        status: { $ref: '#/components/schemas/TenantStatus' }
    SessionAccount:
      type: object
      required: [id, email, fullName, role, isPlatformOperator]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: [string, 'null'] }
        role: { oneOf: [ { $ref: '#/components/schemas/Role' }, { type: 'null' } ], description: Role in the active tenant; null when tenantless. }
        isPlatformOperator: { type: boolean }
    MembershipView:
      type: object
      required: [id, tenant, role, status]
      properties:
        id: { type: string, format: uuid }
        tenant: { $ref: '#/components/schemas/TenantSummary' }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/MembershipStatus' }
    SessionView:
      type: object
      required: [account, activeTenant, memberships, flags]
      properties:
        account: { $ref: '#/components/schemas/SessionAccount' }
        activeTenant: { oneOf: [ { $ref: '#/components/schemas/TenantSummary' }, { type: 'null' } ] }
        memberships: { type: array, items: { $ref: '#/components/schemas/MembershipView' }, description: Active memberships only. }
        flags: { type: object, additionalProperties: { type: boolean } }
    LogoutResult:
      type: object
      required: [logoutUrl]
      properties:
        logoutUrl: { type: string, format: uri, description: Where the client navigates next. }
    SwitchTenantRequest:
      type: object
      properties:
        tenantId: { type: string, format: uuid }
    PageInfo:
      type: object
      required: [page, size, totalItems]
      properties:
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
    InvitationStatus: { type: string, enum: [pending, accepted, revoked, expired] }
    TenantView:
      allOf:
        - { $ref: '#/components/schemas/TenantSummary' }
        - type: object
          required: [createdAt]
          properties:
            createdAt: { type: string, format: date-time }
    MemberAccount:
      type: object
      required: [id, email, fullName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: [string, 'null'] }
    MemberView:
      allOf:
        - { $ref: '#/components/schemas/MembershipView' }
        - type: object
          required: [account, createdAt]
          properties:
            account: { $ref: '#/components/schemas/MemberAccount' }
            createdAt: { type: string, format: date-time }
    InvitationView:
      type: object
      required: [id, email, role, status, expiresAt, createdAt, acceptedAt, revokedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
    InvitationCreated:
      type: object
      required: [invitation, invitationUrl]
      properties:
        invitation: { $ref: '#/components/schemas/InvitationView' }
        invitationUrl: { type: string, format: uri, description: '<public base URL>/invitations/accept#token=<43 base64url chars>' }
    TenantCreated:
      type: object
      required: [tenant, invitation, invitationUrl]
      properties:
        tenant: { $ref: '#/components/schemas/TenantView' }
        invitation: { $ref: '#/components/schemas/InvitationView' }
        invitationUrl: { type: string, format: uri }
    AcceptResult:
      type: object
      required: [membership]
      properties:
        membership: { $ref: '#/components/schemas/MembershipView' }
    AcceptNewResult:
      type: object
      required: [membership, account]
      properties:
        membership: { $ref: '#/components/schemas/MembershipView' }
        account: { $ref: '#/components/schemas/MemberAccount' }
    CreateTenantRequest:
      type: object
      properties:
        slug: { type: string, description: '3-40 chars, ^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$, not UUID-shaped, immutable' }
        name: { type: string, description: 1-100 chars after trimming }
        adminEmail: { type: string, format: email }
    SetTenantStatusRequest:
      type: object
      properties:
        status: { $ref: '#/components/schemas/TenantStatus' }
    UpdateMembershipRequest:
      type: object
      description: At least one of role, status.
      properties:
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/MembershipStatus' }
    CreateInvitationRequest:
      type: object
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
    AcceptInvitationRequest:
      type: object
      properties:
        token: { type: string, description: 43 base64url characters from the URL fragment }
    AcceptNewInvitationRequest:
      type: object
      properties:
        token: { type: string }
        password: { type: string, description: 12-64 characters }
        fullName: { type: string, description: 1-100 characters after trimming }
    ApiKeyStatus: { type: string, enum: [active, expired, revoked] }
    ApiKeyView:
      type: object
      required: [id, name, keyPrefix, scopes, status, expiresAt, revokedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        keyPrefix: { type: string, pattern: '^gbk_live_[a-z2-7]{16}$' }
        scopes: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/ApiKeyStatus' }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ApiKeyCreated:
      type: object
      required: [apiKey, plainTextKey]
      properties:
        apiKey: { $ref: '#/components/schemas/ApiKeyView' }
        plainTextKey: { type: string, pattern: '^gbk_live_[a-z2-7]{16}_[a-z2-7]{52}$' }
    ScopeInfo:
      type: object
      required: [name, description]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9-]*:[a-z][a-z0-9-]*$' }
        description: { type: string }
    CreateApiKeyRequest:
      type: object
      properties:
        name: { type: string, description: 1-100 characters after trimming }
        scopes: { type: array, items: { type: string }, description: Non-empty, registered, no duplicates }
        expiresAt: { type: [string, 'null'], format: date-time, description: A past value is accepted and the key is born expired. }
