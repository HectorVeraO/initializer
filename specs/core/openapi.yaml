openapi: 3.1.0
info:
  title: Core
  version: 0.1.0
  description: >-
    Wire contract every platform module shares: the response envelope, the
    error and issue code tables, trace correlation, pagination, the health
    probes and the /api/v1/ fallback.
servers:
  - url: http://localhost:10120
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Liveness probe
      description: Answers 204 while the process serves HTTP. Not enveloped, no X-Trace-Id.
      responses:
        '204':
          description: The process is up.
  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness probe
      description: >-
        Answers 204 when the instance is serving and every readiness check
        passes. Not enveloped, no X-Trace-Id.
      responses:
        '204':
          description: Serving and every check passes.
        '503':
          description: Not serving (draining or starting) or a check fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyBody'
  /api/v1/{path}:
    parameters:
      - name: path
        in: path
        required: true
        allowReserved: true
        schema:
          type: string
      - $ref: '#/components/parameters/Traceparent'
    get:
      operationId: apiFallbackGet
      summary: Unknown API route
      responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
    put:
      operationId: apiFallbackPut
      summary: Unknown API route
      responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
    post:
      operationId: apiFallbackPost
      summary: Unknown API route
      responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
    delete:
      operationId: apiFallbackDelete
      summary: Unknown API route
      responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
    options:
      operationId: apiFallbackOptions
      summary: Unknown API route
      responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
    head:
      operationId: apiFallbackHead
      summary: Unknown API route
      responses:
        '404':
          description: Unknown path or method (no body).
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
    patch:
      operationId: apiFallbackPatch
      summary: Unknown API route
      responses:
        '404':
          $ref: '#/components/responses/RouteNotFound'
components:
  headers:
    XTraceId:
      description: The trace id of the request; equals meta.traceId of the body.
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C Trace Context. A valid value is continued; a missing or malformed one starts a new trace.
      schema:
        type: string
        pattern: '^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$'
  responses:
    RouteNotFound:
      description: Unknown path, or a method no route of the path accepts.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/XTraceId'
        Cache-Control:
          description: Always no-store.
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelopeError'
  schemas:
    ApiMeta:
      type: object
      required: [traceId, timestamp]
      additionalProperties: false
      properties:
        traceId:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: 32 lowercase hex characters, never all zeros.
        timestamp:
          type: string
          format: date-time
          description: RFC 3339 UTC in whole seconds, ending in Z.
    ApiIssue:
      type: object
      required: [field, code, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: JSON path into the request body or a query parameter name; empty means the whole body.
        code:
          $ref: '#/components/schemas/ApiIssueCode'
        message:
          type: string
    ApiError:
      type: object
      required: [code, message, issues]
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ApiErrorCode'
        message:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ApiIssue'
    ApiEnvelopeError:
      type: object
      required: [data, meta, error]
      additionalProperties: false
      properties:
        data:
          type: 'null'
        meta:
          $ref: '#/components/schemas/ApiMeta'
        error:
          $ref: '#/components/schemas/ApiError'
    ApiPage:
      type: object
      required: [items, page, size, totalItems]
      additionalProperties: false
      properties:
        items:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
    HealthReadyBody:
      type: object
      required: [serving, checks]
      additionalProperties: false
      properties:
        serving:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required: [name, status]
            additionalProperties: false
            properties:
              name:
                type: string
              status:
                type: string
                enum: [pass, fail]
    ApiErrorCode:
      type: string
      description: Top-level error.code. The set grows (x-extensible-enum), so a client treats an unknown code as a generic error; renaming or removing a code is a breaking change.
      x-extensible-enum:
        - SESSION_INVALID
        - API_KEY_INVALID_OR_REVOKED
        - CSRF_TOKEN_INVALID
        - INSUFFICIENT_SCOPE
        - INSUFFICIENT_ROLE
        - PLATFORM_OPERATOR_REQUIRED
        - ACTIVE_TENANT_REQUIRED
        - TENANT_MISMATCH
        - TENANT_ACCESS_DENIED
        - TENANT_SUSPENDED
        - MEMBERSHIP_REVOKED
        - ACCOUNT_LOCKED_OR_DISABLED
        - INVITATION_EMAIL_MISMATCH
        - RESOURCE_NOT_FOUND
        - ROUTE_NOT_FOUND
        - FLAG_NOT_DEFINED_IN_MANIFEST
        - INVITATION_INVALID
        - CREDENTIAL_CONFLICT
        - ACTIVE_TENANT_CHANGED
        - LAST_TENANT_ADMIN
        - MEMBERSHIP_ALREADY_ACTIVE
        - INVITATION_NOT_PENDING
        - INVITATION_REQUIRED
        - TENANT_SLUG_TAKEN
        - IDENTITY_ALREADY_EXISTS
        - SYSTEM_PARAMETER_PROTECTED
        - PARAMETER_ALREADY_EXISTS
        - PARAMETER_OVERRIDES_VIOLATE_CONSTRAINTS
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - VALIDATION_FAILED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - IDENTITY_PROVIDER_UNAVAILABLE
    ApiIssueCode:
      type: string
      description: error.issues[].code, always under a 422 VALIDATION_FAILED. The set grows (x-extensible-enum), so a client treats an unknown code as a generic problem.
      x-extensible-enum:
        - BODY_MALFORMED
        - FIELD_REQUIRED
        - FIELD_TYPE_INVALID
        - FIELD_TOO_SHORT
        - FIELD_TOO_LONG
        - FIELD_OUT_OF_RANGE
        - FIELD_INVALID_FORMAT
        - FIELD_NOT_ALLOWED
        - FIELD_DUPLICATE
        - FIELD_MIN_ITEMS
        - PARAMETER_KEY_INVALID
        - PARAMETER_TYPE_MISMATCH
        - PARAMETER_OUT_OF_RANGE
        - PARAMETER_VALUE_NOT_ALLOWED
        - PARAMETER_CONSTRAINT_INVALID
        - PARAMETER_FIELD_IMMUTABLE
